[package]
name = "sphincsplus"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "blake"

[features]
default = ["blake", "robust", "128s"]

# Hash backends (select exactly one)
blake = []
sha2 = []
shake = []
haraka = []

# Thash variants (select exactly one)
robust = []
simple = []

# Security parameters (select exactly one)
128s = []
128f = []
192s = []
192f = []
256s = []
256f = []

[dependencies]
aes = "0.8"

[workspace]
