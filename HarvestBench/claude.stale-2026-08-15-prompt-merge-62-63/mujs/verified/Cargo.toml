[package]
name = "mujs"
version = "1.3.8"
edition = "2021"

[lib]
name = "mujs"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "unwind"
codegen-units = 1

# C `int` arithmetic wraps (two's complement) on the targets this library is
# built for, and the translation transliterates that arithmetic literally.
# Rust's debug overflow checks would turn a wrap into a panic and therefore
# DIVERGE from the C — e.g. `js_remove(J, INT_MAX)` computes `J->bot + idx`
# before range-checking it. The release profile already has overflow checks
# off; turn them off for dev/test too so all profiles behave like the C.
[profile.dev]
overflow-checks = false

[profile.test]
overflow-checks = false

[workspace]
