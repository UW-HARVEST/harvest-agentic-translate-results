[package]
name = "mujs"
version = "1.3.8"
edition = "2024"

[lib]
name = "mujs"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
# NOTE: panic=unwind is required: a JavaScript `throw` unwinds to the innermost
# try frame via a Rust panic (see common::js_try / jsrun::js_throw).
panic = "unwind"
overflow-checks = false
debug-assertions = false

[dev-dependencies]
libloading = "0.8"

[workspace]
