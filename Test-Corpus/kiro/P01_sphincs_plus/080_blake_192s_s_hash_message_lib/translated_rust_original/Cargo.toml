[package]
name = "sphincsplus"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "blake"

[dependencies]
aes = "0.8"

[features]
default = ["blake", "simple", "sphincs-blake-192s"]

# Hash backends
haraka = []
sha2 = []
shake = []
blake = []

# Thash variants
robust = []
simple = []

# Security parameter sets
sphincs-haraka-128s = ["haraka"]
sphincs-haraka-128f = ["haraka"]
sphincs-haraka-192s = ["haraka"]
sphincs-haraka-192f = ["haraka"]
sphincs-haraka-256s = ["haraka"]
sphincs-haraka-256f = ["haraka"]

sphincs-sha2-128s = ["sha2"]
sphincs-sha2-128f = ["sha2"]
sphincs-sha2-192s = ["sha2"]
sphincs-sha2-192f = ["sha2"]
sphincs-sha2-256s = ["sha2"]
sphincs-sha2-256f = ["sha2"]

sphincs-shake-128s = ["shake"]
sphincs-shake-128f = ["shake"]
sphincs-shake-192s = ["shake"]
sphincs-shake-192f = ["shake"]
sphincs-shake-256s = ["shake"]
sphincs-shake-256f = ["shake"]

sphincs-blake-128s = ["blake"]
sphincs-blake-128f = ["blake"]
sphincs-blake-192s = ["blake"]
sphincs-blake-192f = ["blake"]
sphincs-blake-256s = ["blake"]
sphincs-blake-256f = ["blake"]

[workspace]
