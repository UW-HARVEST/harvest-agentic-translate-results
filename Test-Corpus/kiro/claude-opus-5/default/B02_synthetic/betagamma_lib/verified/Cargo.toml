[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
name = "betagamma_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# Address-dependent behaviour (compute_hash reads raw heap addresses) can only be
# compared between the two libraries when both run from an identical heap state,
# so this target re-execs itself once per .so and diffs stdout byte-for-byte.
[[test]]
name = "driver"
path = "tests/driver.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
