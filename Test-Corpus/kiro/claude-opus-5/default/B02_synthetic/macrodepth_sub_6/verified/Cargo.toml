[package]
name = "driver"
version = "0.1.0"
edition = "2021"

# The C project builds an executable from src/mdcore.c + src/mdmain.c.
# Here we additionally expose the mdcore.c public functions/globals as a
# shared library, as required.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "driver"
path = "src/main.rs"

# CMake cache variables become Cargo features, one feature per value:
#
#   set(OP     "add" CACHE STRING "operation leveraged")  -> add | sub | mul
#   set(REPEAT "5"   CACHE STRING "iterations tested")    -> 0 .. 7
#
# The REPEAT values are exposed both under their bare CMake value ("0".."7")
# and under a readable `repeat_N` alias; enabling either one is equivalent.
#
# Valid REPEAT values are 0..7 because mdmacros.h only defines REP0..REP7,
# so CHOOSE_REP(REPEAT) would not compile for anything else.
[features]
default = ["add", "repeat_5"]

# ---- OP ----
add = []
sub = []
mul = []

# Readable aliases of the OP values (used by verify.sh).
op_add = ["add"]
op_sub = ["sub"]
op_mul = ["mul"]

# ---- REPEAT ----
repeat_0 = []
repeat_1 = []
repeat_2 = []
repeat_3 = []
repeat_4 = []
repeat_5 = []
repeat_6 = []
repeat_7 = []

# Bare CMake values, kept as aliases of the above.
"0" = ["repeat_0"]
"1" = ["repeat_1"]
"2" = ["repeat_2"]
"3" = ["repeat_3"]
"4" = ["repeat_4"]
"5" = ["repeat_5"]
"6" = ["repeat_6"]
"7" = ["repeat_7"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
