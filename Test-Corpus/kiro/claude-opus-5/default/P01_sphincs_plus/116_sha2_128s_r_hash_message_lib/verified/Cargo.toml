[package]
name = "sphincs_plus"
version = "0.1.0"
edition = "2021"

[lib]
name = "sha2"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
aes = "0.8.4"

[dev-dependencies]
libloading = "0.8"

[features]
default = ["sha2", "robust", "128s"]

# HASH_BACKEND cache variable values
haraka = []
sha2 = []
shake = []
blake = []
# The CMake cache docstring also lists "shake256" as a spelling of the SHAKE
# backend; accept it as an alias.
shake256 = ["shake"]

# THASH cache variable values
robust = []
simple = []

# SECPAR cache variable values
"128s" = []
"128f" = []
"192s" = []
"192f" = []
"256s" = []
"256f" = []

[profile.release]
opt-level = 3

[workspace]
