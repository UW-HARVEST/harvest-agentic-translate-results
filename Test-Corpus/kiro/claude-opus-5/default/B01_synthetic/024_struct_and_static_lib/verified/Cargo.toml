[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# Custom harness: the test binary re-execs itself in "child mode" to give each
# scenario a fresh copy of the libraries' mutable global state, which requires
# control over `main`.
[[test]]
name = "ffi_equivalence"
path = "tests/ffi_equivalence.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
