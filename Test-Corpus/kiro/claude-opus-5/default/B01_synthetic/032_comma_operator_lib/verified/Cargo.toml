[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# `harness = false`: the test redirects file descriptor 1 to capture stdout from
# the loaded shared objects, so libtest's own progress output (written from
# other threads) must not be interleaved with it.
[[test]]
name = "driver_ffi"
path = "tests/driver_ffi.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
