[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# The differential tests redirect the process-wide stdout file descriptor in
# order to capture what the C and Rust libraries print. libtest's own parallel
# progress output would be captured along with it, so this target supplies its
# own single-threaded runner instead.
[[test]]
name = "differential"
path = "tests/differential.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
