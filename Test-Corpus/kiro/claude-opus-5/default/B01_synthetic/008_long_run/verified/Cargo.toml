[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
opt-level = 3
codegen-units = 1

# The C program performs 2000 * 100 * 256Ki arithmetic steps per run.  The
# differential tests in tests/ execute the binary built with the dev/test
# profile, so it is optimised too -- otherwise `cargo test` would take hours.
[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[workspace]
