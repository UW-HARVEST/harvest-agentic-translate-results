[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"

[dev-dependencies]
libloading = "0.8"

# Differential tests for crash / hang / out-of-memory behaviour need to run the
# library in a child process, so this target manages its own `main`.
[[test]]
name = "robustness"
path = "tests/robustness.rs"
harness = false

[workspace]
