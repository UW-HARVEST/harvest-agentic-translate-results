[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "call_predict_lib"

[features]
default = []
# Test-only scaffolding: re-exports the `static` C helpers (which the C .so does
# not export either) so translation/tests/ can compare them against
# harness/wrap.c. NOT enabled by default -- the default build keeps exact
# `nm -D` symbol parity with the C shared library.
test_internals = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
