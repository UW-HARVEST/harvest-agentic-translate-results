[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[features]
default = ["add", "repeat_5"]
# OP cache variable values
add = []
sub = []
mul = []
# REPEAT cache variable values
repeat_0 = []
repeat_1 = []
repeat_2 = []
repeat_3 = []
repeat_4 = []
repeat_5 = []
repeat_6 = []
repeat_7 = []

[profile.release]
opt-level = 3

[workspace]
