[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
# Only build the cdylib for the lib target. Tests load the .so via libloading
# rather than linking the rlib, and the bin uses `#[path]` to include the
# decision module directly so it doesn't need an rlib dependency.
crate-type = ["cdylib"]

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dev-dependencies]
libloading = "0.8"

[workspace]
