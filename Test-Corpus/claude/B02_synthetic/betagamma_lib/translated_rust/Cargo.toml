[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "betagamma_lib"

[[bin]]
name = "betagamma_runner"
path = "src/bin/betagamma_runner.rs"

[dependencies]
libc = "0.2"
libloading = "0.8"

[profile.release]
opt-level = 3

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[workspace]
