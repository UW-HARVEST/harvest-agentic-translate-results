[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "translated_rust"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
libc = "0.2"

[dev-dependencies]
libloading = "0.8"

[workspace]
