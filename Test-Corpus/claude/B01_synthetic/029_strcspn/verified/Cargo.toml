[package]
name = "driver"
version = "0.1.0"
edition = "2021"

# C-ABI shared library mirroring the symbols of c_src/src/main.c built with
# `gcc -shared -fPIC` (exports `driver` and `main`).
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "driver"
path = "src/main.rs"

# No compile-time features exist for this crate (the C side has no #ifdef /
# CMake option either). The only valid configuration is the empty feature set;
# see CONFIGS.md.
[features]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
