[package]
name = "driver"
version = "0.1.0"
edition = "2021"

# The C source compiled as a shared object exports a single symbol, `main`;
# this cdylib exports the same symbol so the two can be compared via dlopen.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]
# The lib exports `#[no_mangle] main`, which cannot coexist with the entry point
# libtest generates, and it has no unit tests of its own; it is exercised
# through `dlopen` by tests/differential_so.rs instead.
test = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
panic = "abort"

[workspace]
