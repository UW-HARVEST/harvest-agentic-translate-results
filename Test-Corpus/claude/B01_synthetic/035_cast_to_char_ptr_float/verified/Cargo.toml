[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
panic = "abort"

[workspace]

[features]
default = []
# Export a C-ABI `main` from the library (see `src/lib.rs`). With this on,
# `src/main.rs` becomes `#![no_main]` and the exported `main` is the entry
# point, so the `cdylib` exports the same symbol set as the C `.so`.
c_main = []

[dev-dependencies]
libloading = "0.8"
