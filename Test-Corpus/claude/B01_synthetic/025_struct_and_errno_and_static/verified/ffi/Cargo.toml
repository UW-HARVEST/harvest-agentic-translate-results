[package]
name = "driver_ffi"
version = "0.1.0"
edition = "2021"

# Mirrors `gcc -shared -fPIC c_src/src/main.c`: a shared object exporting the
# translation unit's two externally linked symbols, `main` and `run`.
[lib]
name = "driver_ffi"
path = "src/lib.rs"
crate-type = ["cdylib"]
doctest = false

[dependencies]
driver = { path = ".." }
