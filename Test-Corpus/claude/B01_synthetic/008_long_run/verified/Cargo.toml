[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

# C-ABI shared object used by the differential test-suite: exports the same
# symbols as `gcc -shared c_src/src/main.c`.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]
# The cdylib exports a C-ABI `main`, which cannot coexist with the Rust test
# harness's own entry point; the library is exercised through `tests/` (dlopen).
test = false
doctest = false
bench = false

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
opt-level = 3
overflow-checks = false
debug-assertions = false

[workspace]
