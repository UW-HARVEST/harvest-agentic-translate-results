[package]
name = "driver"
version = "0.1.0"
edition = "2021"

# Mirrors `add_executable(driver src/main.c)` from c_src/CMakeLists.txt.
[[bin]]
name = "driver"
path = "src/main.rs"

# The same translation unit built as a shared library, so that the exported
# C-ABI symbols (`driver`, `main`) can be loaded with dlopen/dlsym and
# compared against the C shared library. Only a cdylib is produced: an rlib
# would make the binary link the library's `main` symbol and collide with the
# binary's own entry point.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]
# The library exports a C-ABI `main`, which would collide with the libtest
# harness entry point, and it holds no unit tests of its own: all testing is
# differential, through the `.so` exports, from tests/.
test = false
doctest = false

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
