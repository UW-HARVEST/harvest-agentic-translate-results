[package]
name = "fma_array"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "fma_array"
path = "src/lib.rs"
crate-type = ["cdylib"]
# The library exports a `#[no_mangle] main` (the C `.so` exports one too), which
# collides with the entry point libtest generates, so the lib has no unit-test
# harness of its own; all verification lives in tests/ and goes through dlopen.
test = false
bench = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
