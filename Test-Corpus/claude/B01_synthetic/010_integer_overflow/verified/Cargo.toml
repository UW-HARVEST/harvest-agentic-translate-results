[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
# Mirrors the C translation unit built as `gcc -shared -fPIC`: exports
# `main` and `printHexCharLine` with C linkage.
crate-type = ["cdylib"]
# The library exports a C `main`; a Rust unit-test harness would add its own
# entry point and clash with it, so unit tests/doctests live in tests/ instead.
test = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"

# The C build (c_src/CMakeLists.txt) has no options, no `#ifdef`s and no
# compile definitions, so the translation has no build-time configuration
# either.  `default` is the only feature combination that exists.
[features]
default = []

[dev-dependencies]
libloading = "0.8"

# Redirecting file descriptor 1 to capture what the loaded libraries print is a
# process-wide operation, so these tests must not run concurrently with
# libtest's own (parallel) progress output: they use a custom sequential
# harness.
[[test]]
name = "inprocess"
path = "tests/inprocess.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
