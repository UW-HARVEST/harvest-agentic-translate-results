[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[features]
default = []

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
opt-level = 3

[workspace]
