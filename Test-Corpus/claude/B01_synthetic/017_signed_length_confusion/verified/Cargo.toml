[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
# `cdylib` mirrors the shared object built from the C translation unit, so that
# the exported `printLine` symbol can be loaded and exercised by an external
# caller.  `rlib` is what the `driver` binary itself links against.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "driver"
path = "src/main.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
