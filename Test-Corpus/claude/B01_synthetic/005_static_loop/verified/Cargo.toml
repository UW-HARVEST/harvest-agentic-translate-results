[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
opt-level = 3

[features]
default = []
# When enabled, exports a C-callable `main` symbol from the cdylib so it
# matches the C build's exported symbol set. This is OFF by default so
# the rlib (used by integration tests) does not clash with the test
# harness's own `main`.
export_main = []

[dev-dependencies]
libloading = "0.8"

[workspace]
