[package]
name = "sphincs_plus"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "sphincs_plus"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[features]
default = ["sha2", "robust", "128f"]

# Hash backend selection (CMake HASH_BACKEND values)
haraka = []
sha2 = []
shake = []
blake = []

# thash variant selection (CMake THASH values)
robust = []
simple = []

# Security parameter selection (CMake SECPAR values)
"128s" = []
"128f" = []
"192s" = []
"192f" = []
"256s" = []
"256f" = []

[profile.release]
opt-level = 3

[workspace]
