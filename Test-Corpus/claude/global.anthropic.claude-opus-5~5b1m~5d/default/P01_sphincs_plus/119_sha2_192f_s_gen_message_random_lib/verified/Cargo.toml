[package]
name = "sphincs_plus"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "sha2"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

[features]
default = ["sha2", "simple", "192f"]

# Hash backend selection (CMake HASH_BACKEND values)
haraka = []
sha2 = []
shake = []
blake = []

# thash variant selection (CMake THASH values)
robust = []
simple = []

# Security parameter selection (CMake SECPAR values)
"128s" = []
"128f" = []
"192s" = []
"192f" = []
"256s" = []
"256f" = []

[profile.release]
opt-level = 3

[workspace]
