[package]
name = "harvest_translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "cleanup_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# The differential tests redirect fd 1 to capture the exact bytes each `.so`
# writes through C stdio. libtest's own progress output goes to fd 1 as well and
# would pollute the comparison, so these targets use a hand-rolled sequential
# runner that reports on stderr instead.
[[test]]
name = "phase_b_configs"
path = "tests/phase_b_configs.rs"
harness = false

[[test]]
name = "phase_c_errors"
path = "tests/phase_c_errors.rs"
harness = false

[[test]]
name = "phase_d_symbols"
path = "tests/phase_d_symbols.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
