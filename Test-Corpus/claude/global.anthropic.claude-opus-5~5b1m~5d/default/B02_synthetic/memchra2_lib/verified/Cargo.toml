[package]
name = "harvest_lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "memchra2_lib"

[features]
default = []
# Exports `harness_*` C wrappers around the (otherwise private) translations of
# `lib.c`'s `static` helpers so that the error-surface rows of ERRORS.md can be
# driven directly across the FFI boundary. OFF by default: with the default
# feature set the Rust `.so` exports exactly the same symbol set as the C `.so`.
test_internals = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
