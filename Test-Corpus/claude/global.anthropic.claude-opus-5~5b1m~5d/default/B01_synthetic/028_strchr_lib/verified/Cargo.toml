[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[[test]]
name = "differential"
path = "tests/differential.rs"

# The stdout-comparison tests capture file descriptor 1, which is process
# global. libtest's own progress output and its parallel threads would land in
# the capture, so these tests run without the libtest harness: sequentially,
# with all progress written to stderr.
[[test]]
name = "driver_stdout"
path = "tests/driver_stdout.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
