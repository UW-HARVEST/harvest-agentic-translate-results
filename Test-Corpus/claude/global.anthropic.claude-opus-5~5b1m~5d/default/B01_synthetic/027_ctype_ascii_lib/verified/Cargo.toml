[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# The differential suite captures the library's `printf` output by redirecting
# file descriptor 1, which is process-global state; libtest's multi-threaded
# harness writes its own progress to the same descriptor. The suite therefore
# supplies its own strictly sequential runner.
[[test]]
name = "diff"
path = "tests/diff.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
