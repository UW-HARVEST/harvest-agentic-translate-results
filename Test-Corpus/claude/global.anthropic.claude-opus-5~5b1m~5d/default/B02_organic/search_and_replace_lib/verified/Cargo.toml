[package]
name = "translation"
version = "0.1.0"
edition = "2021"

# The C build (c_src/CMakeLists.txt) produces `libdriver.so` from a SHARED
# library target named `driver`; keep the artifact name identical so this crate
# is a drop-in replacement for the C shared object.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
# Loaded dynamically by the differential integration tests in `tests/`.
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
