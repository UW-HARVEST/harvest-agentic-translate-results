[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "load_png_mem_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"

[workspace]

[dev-dependencies]
libloading = "0.8"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
