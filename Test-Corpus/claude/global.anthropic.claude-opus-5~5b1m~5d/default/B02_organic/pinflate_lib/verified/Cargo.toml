[package]
name = "translation"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "pinflate_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# Differential test suite: needs full control over the process (it re-executes
# itself as a worker so that `assert()` aborts can be observed), so it does not
# use the libtest harness.
[[test]]
name = "differential"
path = "tests/differential.rs"
harness = false

[[test]]
name = "symbols"
path = "tests/symbols.rs"

[profile.release]
panic = "abort"

[workspace]
