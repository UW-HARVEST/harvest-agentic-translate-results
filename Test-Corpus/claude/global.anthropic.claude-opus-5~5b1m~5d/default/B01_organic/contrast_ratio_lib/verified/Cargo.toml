[package]
name = "contrast_ratio"
version = "0.1.0"
edition = "2021"

[lib]
name = "contrast_ratio_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
# Keep default (IEEE-strict) float semantics; never enable fast-math style
# optimizations, they would change the bit patterns of the results.
opt-level = 3
panic = "abort"
codegen-units = 1

[workspace]
