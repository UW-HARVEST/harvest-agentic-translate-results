[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "hm_geti_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

# This crate is a literal translation of a C library and must reproduce the C
# semantics *exactly* in every profile, including the parts C leaves undefined:
#   * rustc's debug-assertion "null pointer dereference" / "misaligned pointer
#     dereference" checks turn C's SIGSEGV into a Rust panic (SIGABRT), and
#   * overflow checks turn C's silent two's-complement wrap-around into a panic
#     (the translation already spells every intentional wrap with `wrapping_*`).
# Both are off in `release`, so they are turned off in `dev` as well; otherwise
# the two artifacts of the same source would behave differently.
[profile.dev]
debug-assertions = false
overflow-checks = false

[workspace]
