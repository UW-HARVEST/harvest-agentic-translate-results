[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
# NOTE: cargo >= 1.79 rejects hyphens in library target names ("library target
# names cannot contain hyphens").  The hyphenated spelling
# "underhanded-c-nuke_lib" would in any case have been emitted on disk as
# libunderhanded_c_nuke_lib.so, so the underscore spelling below produces the
# exact same artifact name while letting the manifest parse.
name = "underhanded_c_nuke_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
overflow-checks = false
debug-assertions = false

[workspace]
