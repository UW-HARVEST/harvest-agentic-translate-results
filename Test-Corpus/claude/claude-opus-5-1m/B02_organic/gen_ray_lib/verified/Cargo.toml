[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "gen_ray_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"

# The C library performs no null / alignment / overflow checks: it writes
# through `c2Raycast *out` unconditionally, so a NULL or misaligned `out`
# faults (or, on x86, just works) exactly as the hardware dictates.
#
# rustc's `-Cdebug-assertions=on` (the dev default) inserts `ub_checks` that
# turn those same situations into a Rust panic -> `SIGABRT`, which is a
# behavioural difference from the C artifact (`SIGSEGV`).  Disabling them keeps
# the dev profile faithful to the C and identical to the release profile.
# See ERRORS.md rows E26-E29 and E36.
[profile.dev]
debug-assertions = false
overflow-checks = false

[workspace]

[dev-dependencies]
libloading = "0.8"
