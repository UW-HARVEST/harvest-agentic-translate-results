[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "str_dups_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# No build-time configuration axes: the C library (c_src/CMakeLists.txt) is a
# single unconditional target with no options/#ifdef variants, so the only valid
# feature combination is the empty set.  See CONFIGS.md §0.

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"
overflow-checks = false
debug-assertions = false

[workspace]
