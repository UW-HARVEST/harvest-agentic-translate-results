[package]
name = "driver"
version = "0.1.0"
edition = "2021"

# The C source compiled as a shared object exports `driver` and `main`; the
# `cdylib` mirrors that surface so the differential tests can dlopen both.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
# `lib.rs` exports `#[no_mangle] extern "C" fn main`, which cannot coexist with the
# entry point rustc generates for a test harness; all tests are integration tests.
test = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"
test = false

[[test]]
name = "ffi_driver"
path = "tests/ffi_driver.rs"
harness = false

[[test]]
name = "ffi_main"
path = "tests/ffi_main.rs"
harness = false

[[test]]
name = "errors"
path = "tests/errors.rs"
harness = false

[[test]]
name = "cli_diff"
path = "tests/cli_diff.rs"
harness = false

[[test]]
name = "symbols"
path = "tests/symbols.rs"
harness = false

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
