[package]
name = "driver"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Shared-library surface. `main` is the only symbol the C `.so` exports, so the
# Rust `.so` must export it too (see SYMBOLS.md). The rlib is what the
# integration tests link against; the cdylib is what they dlopen().
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
# The library exports a symbol literally named `main` (to match the C `.so`),
# which collides with the entry symbol libtest generates for a unit-test
# harness. There are no unit tests here by design: the C behavior is verified
# only through the `.so` exports in tests/, exactly as an external caller sees
# them, never by calling Rust functions directly.
test = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
