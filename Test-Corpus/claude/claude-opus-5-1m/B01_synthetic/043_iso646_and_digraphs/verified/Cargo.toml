[package]
name = "driver"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# The translated implementation. Built as an `rlib` (consumed by the binary and
# by the integration tests' cdylib shim) so that the exact same code backs the
# executable and the shared object that the differential tests load.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "driver"
path = "src/main.rs"

# FFI shim exposing the same C ABI surface as the original translation unit
# (`driver` and `main`). Built as a cdylib so the differential tests can
# `dlopen` the Rust code and the C code side by side and compare them through
# the FFI boundary, exactly as an external caller would.
[[example]]
name = "driver_ffi"
path = "examples/driver_ffi.rs"
crate-type = ["cdylib"]

[profile.release]
panic = "abort"

[dev-dependencies]
libloading = "0.8"

[workspace]
