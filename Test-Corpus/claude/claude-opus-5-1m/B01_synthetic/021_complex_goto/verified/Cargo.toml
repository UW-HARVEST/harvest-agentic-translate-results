[package]
name = "goto_loop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

# The C target (c_src/CMakeLists.txt) is `add_executable(driver src/main.c)`, i.e.
# a program, not a shared library: it exports zero dynamic symbols and its only
# non-`main` function (`foo`) is `static`.  Differential testing therefore runs
# both programs as processes and compares stdout/stderr/exit-status byte for
# byte.  `libloading` is kept available for symbol-level probing of the two
# binaries even though there is no `.so` surface to dlopen.
[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
