[package]
name = "driver"
version = "0.1.0"
edition = "2021"

# The C project (c_src/CMakeLists.txt) builds `src/main.c` into an executable
# named `driver`.  The same translation unit can also be built as a shared
# library, in which case it exports the two non-static functions `driver` and
# `main`.  The Rust side therefore provides two targets:
#
#   * bin  `driver`        -- the program (byte-identical stdout to the C exe)
#   * lib  `libdriver.so`  -- a cdylib exporting `driver` and `main` with C ABI
#
# Both targets share the exact same implementation (src/logic.rs).

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]
# The cdylib exports a `#[no_mangle] extern "C" fn main`, which would collide
# with the `main` generated by libtest, so no unit-test harness for the lib.
test = false
doctest = false
bench = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
panic = "abort"

[workspace]
