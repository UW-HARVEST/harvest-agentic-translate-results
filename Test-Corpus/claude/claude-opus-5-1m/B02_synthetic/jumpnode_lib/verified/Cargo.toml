[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "jumpnode_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# Test-only: export thin wrappers around the `static` helpers of lib.c so the
# differential suite can reach code that the public `jumpnode` entry point
# cannot (because `initialize_test_data` is never called). OFF by default: the
# default build exports exactly the same symbol set as the C .so.
shadow_probe = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
opt-level = 3

[workspace]
