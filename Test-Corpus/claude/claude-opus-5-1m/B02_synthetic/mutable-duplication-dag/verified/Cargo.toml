[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "dag_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "driver"
path = "src/main.rs"

[[test]]
name = "ffi_diff"
path = "tests/ffi_diff.rs"
harness = false

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
