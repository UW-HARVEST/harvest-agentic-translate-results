[package]
name = "sphincsplus"
version = "0.1.0"
edition = "2021"

[lib]
name = "sha2"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
aes = "=0.8.4"

[dev-dependencies]
libloading = "0.8"

[features]
# HASH_BACKEND cache variable values
haraka = []
sha2 = []
shake = []
blake = []
# THASH cache variable values
robust = []
simple = []
# SECPAR cache variable values
"128s" = []
"128f" = []
"192s" = []
"192f" = []
"256s" = []
"256f" = []
default = ["sha2", "simple", "128s"]

[profile.release]
opt-level = 3

[workspace]
