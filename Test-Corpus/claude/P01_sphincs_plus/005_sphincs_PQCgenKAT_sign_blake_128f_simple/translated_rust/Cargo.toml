[package]
name = "sphincsplus"
version = "0.1.0"
edition = "2021"

[lib]
name = "sphincsplus"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cipher = "0.4"

[features]
default = ["haraka", "robust", "128s"]

# Hash backends (select exactly one)
blake = []
haraka = []
sha2 = []
shake = []

# THASH variants (select exactly one)
robust = []
simple = []

# Security parameters (select exactly one)
128s = []
128f = []
192s = []
192f = []
256s = []
256f = []

[dev-dependencies]
libloading = "0.8"

[workspace]
