[package]
name = "sphincs_plus"
version = "0.1.0"
edition = "2021"

[lib]
name = "sphincs_plus"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[features]
default = ["blake", "robust", "192f"]

# Hash backends (mutually exclusive)
haraka = []
sha2 = []
shake = []
blake = []

# thash variant
robust = []
simple = []

# Security parameters
"128s" = []
"128f" = []
"192s" = []
"192f" = []
"256s" = []
"256f" = []

[dependencies]
aes = "0.8"
sha2 = { version = "0.10", features = ["compress"] }

[profile.release]
opt-level = 3

[workspace]
