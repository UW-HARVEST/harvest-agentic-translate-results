[package]
name = "sphincsplus"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cipher = "0.4"

[features]
default = ["sha2", "robust", "256f"]

# Hash backends (select exactly one)
blake = []
haraka = []
sha2 = []
shake = []

# THASH variants (select exactly one)
robust = []
simple = []

# Security parameters (select exactly one)
128s = []
128f = []
192s = []
192f = []
256s = []
256f = []

[workspace]
