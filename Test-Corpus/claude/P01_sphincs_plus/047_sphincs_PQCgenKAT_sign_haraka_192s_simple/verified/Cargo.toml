[package]
name = "sphincs_plus"
version = "0.1.0"
edition = "2021"

[lib]
name = "sphincs_plus"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[features]
default = ["haraka", "simple", "192s"]

# Hash backends
haraka = []
sha2 = []
shake = []
blake = []

# THASH variants
robust = []
simple = []

# SECPAR variants
"128s" = []
"128f" = []
"192s" = []
"192f" = []
"256s" = []
"256f" = []

[dependencies]
aes = "0.8"

[dev-dependencies]
libloading = "0.8"

[profile.release]
opt-level = 3

[workspace]
