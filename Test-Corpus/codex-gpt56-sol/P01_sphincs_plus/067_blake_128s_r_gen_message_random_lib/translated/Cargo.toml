[package]
name = "sphincs_plus"
version = "0.1.0"
edition = "2021"
description = "Rust translation of the SPHINCS+ reference implementation (build-time configurable)"

[lib]
name = "blake"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["blake", "robust", "128s"]

# ---- HASH_BACKEND ----
haraka = []
sha2 = []
shake = []
# alias accepted by the CMake docstring ("shake256")
shake256 = ["shake"]
blake = []

# ---- THASH ----
robust = []
simple = []

# ---- SECPAR ----
"128s" = []
"128f" = []
"192s" = []
"192f" = []
"256s" = []
"256f" = []

[profile.release]
opt-level = 3

[workspace]
