[package]
name = "sphincs-plus-translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "sha2"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["sha2", "simple", "192s"]

haraka = []
sha2 = []
shake = []
blake = []

robust = []
simple = []

"128s" = []
"128f" = []
"192s" = []
"192f" = []
"256s" = []
"256f" = []

[dependencies]
aes = "0.8"
getrandom = "0.3"
sha256 = { package = "sha2", version = "0.10.9", features = ["compress"] }
sha3 = "0.10.9"

[dev-dependencies]
libloading = "0.8"

[profile.release]
overflow-checks = false
panic = "abort"

[workspace]
