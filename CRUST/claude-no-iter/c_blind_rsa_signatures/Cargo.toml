[package]
name = "c-blind-rsa-signatures"
version = "0.1.0"
edition = "2021"

[dependencies]
openssl = "0.10"
openssl-sys = "0.9"
rsa = { version = "0.9", features = ["sha2", "hazmat"] }
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
rand = "0.8"
num-bigint-dig = "0.8"
num-traits = "0.2"
num-integer = "0.1"
pkcs1 = { version = "0.7", features = ["alloc"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
spki = { version = "0.7", features = ["alloc"] }
digest = "0.10"