[package]
name = "c-blind-rsa-signatures"
version = "0.1.0"
edition = "2021"

[dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
rsa = { version = "0.9", features = ["std", "pem", "hazmat", "sha2"] }
sha2 = "0.10"
num-bigint-dig = "0.8"
num-traits = "0.2"
num-integer = "0.1"
rand = "0.8"
rand_core = { version = "0.6", features = ["std", "getrandom"] }
digest = "0.10"
once_cell = "1"
pkcs1 = "0.7"
pkcs8 = "0.10"
der = "0.7"
spki = "0.7"