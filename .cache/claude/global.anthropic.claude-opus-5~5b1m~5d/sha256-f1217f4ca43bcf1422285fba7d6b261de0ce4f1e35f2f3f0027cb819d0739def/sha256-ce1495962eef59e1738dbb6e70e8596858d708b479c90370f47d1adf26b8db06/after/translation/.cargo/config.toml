# The differential tests capture stdout by redirecting file descriptor 1, which
# is process-global. libtest's own progress lines ("test foo ... ok") are written
# by the main thread and would land inside a capture if tests ran concurrently,
# so the suite must run single-threaded.
#
# Setting it here means a plain `cargo test` is correct, with no extra flags.
[env]
RUST_TEST_THREADS = "1"
