# The differential tests redirect the process-wide file descriptor 1 in order to
# capture what the two shared libraries print through libc `printf`. That is a
# process-global operation, so the test harness must not run tests in parallel.
[env]
RUST_TEST_THREADS = "1"

# The crates.io mirror is not reachable from the build sandbox; the required
# crates are already present in the local cargo cache.
[net]
offline = true
