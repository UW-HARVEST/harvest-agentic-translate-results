# The differential harness forks a child per measurement (see
# tests/common/mod.rs). Forking from a multi-threaded process while another
# thread may hold a libc allocator lock is unsafe, so the test harness is
# pinned to a single thread. This also keeps the harness's own progress output
# out of the captured windows.
[env]
RUST_TEST_THREADS = "1"
