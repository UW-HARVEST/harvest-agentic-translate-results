[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]
name = "modeselect_lib"

[dev-dependencies]
libloading = "0.8"

# LD_PRELOAD interposer used by tests/phase_b_faketime.rs to drive the
# `time(NULL)` dependency of get_modified_time/modeselect deterministically.
[[example]]
name = "faketime"
crate-type = ["cdylib"]
path = "examples/faketime.rs"

[profile.release]
panic = "abort"

