# The differential test harness needs `libloading` as a dev-dependency.  Its
# sources (plus `cfg-if` and the unused-on-Linux `windows-link`) are vendored
# into `vendor/` so `cargo test` works with no network access and without
# depending on a warm ~/.cargo registry cache.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true
