# The differential tests capture file descriptors 1 and 2 process-wide in order
# to compare what the C and Rust shared objects write through the C stdio layer.
# That is inherently a per-process operation, so the tests must not run
# concurrently: another thread's output (including libtest's own "test ... ok"
# progress lines) would otherwise land inside a capture window.
[env]
RUST_TEST_THREADS = "1"
