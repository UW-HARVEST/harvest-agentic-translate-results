[package]
name = "lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "doubleneg_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# These two suites redirect the process's fd 1 to compare `printf` output
# byte-for-byte. libtest writes its own progress lines to fd 1 from other
# threads, which would be captured and corrupt the comparison, so they opt out
# of libtest and run sequentially via `common::run_sequentially`.
[[test]]
name = "doubleneg"
harness = false

[[test]]
name = "errors"
harness = false

[profile.release]
panic = "abort"

[workspace]
