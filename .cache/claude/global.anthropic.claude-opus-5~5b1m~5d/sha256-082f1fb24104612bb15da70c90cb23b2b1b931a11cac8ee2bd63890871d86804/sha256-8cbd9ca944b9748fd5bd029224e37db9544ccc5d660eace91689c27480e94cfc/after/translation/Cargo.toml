[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
name = "ima_parse_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# The C library performs completely unchecked loads and stores through the
# caller-supplied pointers (`header->type`, `*info = ...`), so it simply faults
# on a NULL/invalid pointer.  Rust's `debug_assertions`-gated UB checks would
# instead turn those into a `null pointer dereference` panic + abort, making a
# dev-profile build of this cdylib behave differently from the C for exactly the
# inputs Phase C exercises.  Disabling them keeps every profile faithful.
[profile.dev]
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"

[workspace]
