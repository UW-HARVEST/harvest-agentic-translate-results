# The differential tests capture the process-global file descriptor 1 in order
# to compare what the C and Rust `.so`s write with `printf`.  libtest's own
# progress output ("test foo ... ok") also goes to fd 1, so tests must not run
# concurrently with a capture — otherwise that text is spliced into the captured
# bytes and produces bogus "divergences".
[env]
RUST_TEST_THREADS = "1"

# The crate registry is unreachable in this environment; all dependencies are
# already present in the local cargo cache.
[net]
offline = true
