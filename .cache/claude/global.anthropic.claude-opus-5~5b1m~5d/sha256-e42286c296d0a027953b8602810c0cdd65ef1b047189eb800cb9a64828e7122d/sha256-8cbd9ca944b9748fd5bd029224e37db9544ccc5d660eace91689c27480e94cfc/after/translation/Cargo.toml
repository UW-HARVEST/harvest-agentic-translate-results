[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "dataentry_lib"
path = "src/lib.rs"
# "rlib" is present ONLY so that `cargo test` treats the library as a
# dependency of the integration tests and therefore rebuilds the cdylib before
# they run. Without it a stale .so silently gets loaded and every differential
# test passes vacuously. The tests never link the rlib; they always dlopen the
# cdylib.
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
opt-level = 2

[workspace]
