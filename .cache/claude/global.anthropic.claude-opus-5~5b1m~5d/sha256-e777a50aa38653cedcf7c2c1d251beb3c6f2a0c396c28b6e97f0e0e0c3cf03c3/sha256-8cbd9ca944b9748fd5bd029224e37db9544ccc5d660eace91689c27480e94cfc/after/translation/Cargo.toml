[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "maxnmin_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

# The C library is compiled with no runtime UB instrumentation, so neither may
# the Rust translation be: with `debug-assertions` on, rustc's `CheckNull` MIR
# pass turns the NULL dereferences in `add_node`/`process_string` (ERRORS.md
# rows 5 and 13) into a Rust panic -> SIGABRT, where the C library raises
# SIGSEGV. `overflow-checks` would likewise panic instead of wrapping. Keeping
# both off makes the debug build behave identically to the release build and to C.
[profile.dev]
panic = "abort"
debug-assertions = false
overflow-checks = false

[workspace]
