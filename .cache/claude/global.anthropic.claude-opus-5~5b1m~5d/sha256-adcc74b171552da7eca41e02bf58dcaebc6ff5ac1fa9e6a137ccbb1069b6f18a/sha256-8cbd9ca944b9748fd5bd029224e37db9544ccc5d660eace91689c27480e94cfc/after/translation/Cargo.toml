[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
name = "unfilter_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"
libc = "0.2"
rand = "0.8"
flate2 = "1"

[profile.release]
panic = "abort"
overflow-checks = false
debug-assertions = false

