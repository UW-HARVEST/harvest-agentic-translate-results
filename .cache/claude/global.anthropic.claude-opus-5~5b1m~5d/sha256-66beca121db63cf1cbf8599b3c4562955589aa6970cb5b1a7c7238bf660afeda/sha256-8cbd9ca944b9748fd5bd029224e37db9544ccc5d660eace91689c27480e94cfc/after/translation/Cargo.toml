[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "call_predict_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = []
# TEST-ONLY: exports thin `probe_*` wrappers around the functions that are
# `static` in the C source, so their arithmetic can be differentially tested
# against a C probe TU that `#include`s c_src/src/lib.c. This feature ADDS
# symbols; it never removes any, so symbol parity with the C `.so` still holds.
# It is OFF by default and must never be enabled for a shipped artifact.
internal_probe = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
