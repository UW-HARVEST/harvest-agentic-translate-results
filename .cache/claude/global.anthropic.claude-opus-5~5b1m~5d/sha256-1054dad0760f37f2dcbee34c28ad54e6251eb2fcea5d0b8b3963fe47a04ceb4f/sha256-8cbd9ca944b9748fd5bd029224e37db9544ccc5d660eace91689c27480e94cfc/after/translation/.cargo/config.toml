# The differential tests capture file descriptor 1 (the real OS stdout that
# libc's `stdout` FILE stream writes to) in order to observe what the C and Rust
# `.so`s printf. fd 1 is process-global, so if libtest ran tests in parallel the
# harness's own progress lines -- and other tests' output -- would land inside a
# capture window. Force the suite to run on a single thread.
[env]
RUST_TEST_THREADS = "1"
