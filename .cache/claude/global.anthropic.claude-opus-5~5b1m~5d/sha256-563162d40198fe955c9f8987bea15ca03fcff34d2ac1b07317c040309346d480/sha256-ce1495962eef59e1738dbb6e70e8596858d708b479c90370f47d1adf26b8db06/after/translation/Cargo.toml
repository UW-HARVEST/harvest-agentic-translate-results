[package]
name = "png"
version = "1.6.59"
edition = "2021"
build = "build.rs"

[lib]
name = "libpng"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "unwind"
overflow-checks = false
debug-assertions = false

# The C sources rely on wrapping integer arithmetic everywhere; make the dev
# profile behave like the release profile so the debug `.so` is usable for
# differential testing too.
[profile.dev]
panic = "unwind"
overflow-checks = false
debug-assertions = false

[dev-dependencies]
libloading = "0.8"

[workspace]
