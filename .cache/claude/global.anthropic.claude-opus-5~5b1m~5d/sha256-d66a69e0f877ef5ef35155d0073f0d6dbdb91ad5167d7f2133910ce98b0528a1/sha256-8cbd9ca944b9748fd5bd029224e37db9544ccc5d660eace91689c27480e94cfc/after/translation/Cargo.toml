[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
name = "agglom_lib"
path = "src/lib.rs"
# `rlib` is added purely so that `cargo test` rebuilds the `cdylib` into
# target/<profile>/ alongside the integration-test binaries; the differential
# tests only ever `dlopen` the `.so`, they never link the Rust code directly.
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
