# The differential tests capture the library's output by redirecting file
# descriptor 1, which is process-global. Running test functions concurrently
# would let libtest's own progress output ("test foo ... ok") land inside a
# capture window and corrupt the comparison, so the test harness is pinned to a
# single thread. `tests/differential.rs` asserts that this is in effect.
[env]
RUST_TEST_THREADS = "1"
