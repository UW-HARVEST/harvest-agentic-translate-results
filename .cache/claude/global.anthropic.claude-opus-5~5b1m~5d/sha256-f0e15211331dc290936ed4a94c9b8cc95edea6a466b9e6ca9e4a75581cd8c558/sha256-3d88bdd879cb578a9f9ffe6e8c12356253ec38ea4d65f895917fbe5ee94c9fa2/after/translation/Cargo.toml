[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
# Float results (including NaN signs) are optimization independent because
# every arithmetic operation goes through the explicit models in `src/sse.rs`;
# verified to be byte-identical at opt-level 0 and 2.
opt-level = 2
