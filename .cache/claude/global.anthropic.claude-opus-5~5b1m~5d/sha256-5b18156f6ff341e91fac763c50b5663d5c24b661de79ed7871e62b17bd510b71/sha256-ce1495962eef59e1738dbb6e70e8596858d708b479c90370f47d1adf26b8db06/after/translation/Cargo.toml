[package]
name = "sodium"
version = "1.0.23"
edition = "2021"

[lib]
name = "libsodium"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
libloading = "0.8"

[profile.release]
opt-level = 2
panic = "abort"
overflow-checks = false
debug-assertions = false

# Mirror release arithmetic semantics so the cdylib under test behaves like the
# shipped library (the C reference relies on wrapping arithmetic everywhere).
[profile.dev]
overflow-checks = false
debug-assertions = false

[profile.test]
overflow-checks = false
debug-assertions = false

[workspace]
