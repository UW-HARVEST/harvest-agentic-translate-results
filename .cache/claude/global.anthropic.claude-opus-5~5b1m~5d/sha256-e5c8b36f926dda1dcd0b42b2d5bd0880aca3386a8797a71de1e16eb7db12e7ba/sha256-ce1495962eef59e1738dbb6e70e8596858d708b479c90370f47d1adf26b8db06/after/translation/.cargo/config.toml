# The differential tests capture file descriptor 1 (the C `stdout` the library
# under test writes to) by redirecting it around each call. fd-1 redirection is
# process-global, so libtest's own progress output ("test foo ... ok") would be
# captured too -- and interleaved from other threads -- corrupting the compared
# bytes. Forcing a single test thread keeps libtest's writes strictly outside
# the redirection windows.
[env]
RUST_TEST_THREADS = "1"
