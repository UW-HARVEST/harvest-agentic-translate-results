# The differential tests capture fd 1 to compare the exact bytes each .so
# writes to stdout. libtest's own progress output would race with that, so the
# test harness must run single-threaded.
[env]
RUST_TEST_THREADS = "1"

# crates.io is unreachable from the build sandbox; libloading is vendored in the
# local registry cache.
[net]
offline = true
