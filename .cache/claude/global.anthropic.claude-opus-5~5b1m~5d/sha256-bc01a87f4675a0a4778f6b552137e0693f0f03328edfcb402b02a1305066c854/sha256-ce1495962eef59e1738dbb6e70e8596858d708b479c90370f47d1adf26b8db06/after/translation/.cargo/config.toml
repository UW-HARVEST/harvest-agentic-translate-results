# The differential tests capture the libraries' `printf` output at the file
# descriptor level (dup2 over fd 1). fd 1 is process-global, so libtest's own
# progress output from a *parallel* test thread would otherwise leak into a
# capture and be mistaken for a divergence. Forcing a single test thread makes
# every capture window exclusive.
[env]
RUST_TEST_THREADS = "1"
