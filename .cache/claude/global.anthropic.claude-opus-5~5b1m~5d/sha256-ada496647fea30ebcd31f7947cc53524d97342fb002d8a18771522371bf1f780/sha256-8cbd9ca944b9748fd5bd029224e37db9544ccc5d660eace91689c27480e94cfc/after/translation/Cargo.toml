[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "read_side_info_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = []
# Reproduce the `.rodata` array order that the C compiler emits at -O2
# (`cmake -DCMAKE_BUILD_TYPE=Release`) instead of the default -O0 order.
# Only observable for the out-of-range `sr_idx == 8` row -- see src/lib.rs.
c_layout_o2 = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
