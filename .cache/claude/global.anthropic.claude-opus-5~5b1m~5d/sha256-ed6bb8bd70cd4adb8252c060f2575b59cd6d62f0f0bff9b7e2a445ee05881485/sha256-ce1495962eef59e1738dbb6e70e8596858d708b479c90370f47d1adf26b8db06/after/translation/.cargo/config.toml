# The differential tests capture `driver`'s output by redirecting file
# descriptor 1, which is process-wide state. Running test functions
# concurrently would let one test's capture window swallow another test's (and
# libtest's own) writes to stdout, producing bogus "divergences".
#
# libtest honours RUST_TEST_THREADS, so setting it here makes a plain
# `cargo test` single-threaded without every invocation needing
# `-- --test-threads=1`.
[env]
RUST_TEST_THREADS = "1"
