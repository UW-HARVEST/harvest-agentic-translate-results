# The crates.io index is unreachable in this environment; the required
# dev-dependencies are already in the local registry cache.
[net]
offline = true

# The differential tests for `buffapp` capture the process-wide stdout file
# descriptor (fd 1) in order to diff the bytes `printf` emits. libtest's own
# progress lines also go to fd 1, so concurrent test threads would interleave
# their output into the capture. Run one test at a time to keep the capture
# exclusive and the whole suite deterministic.
[env]
RUST_TEST_THREADS = "1"
