[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
name = "buffapp_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

# The C this crate mirrors is compiled without any UB instrumentation, so its
# invalid-input behaviour is the raw hardware fault (e.g. SIGSEGV on a NULL
# dereference in `append_to_buffer`, SIGFPE on `INT_MIN / -1`). Rust's debug
# `ub_checks` would instead turn those into a panic/`SIGABRT`, which is an
# observable divergence across the FFI boundary. Disable them so every profile
# reproduces the C exactly; all arithmetic in `src/lib.rs` is already explicitly
# `wrapping_*`, so `overflow-checks` never contributes anything but divergence.
[profile.dev]
debug-assertions = false
overflow-checks = false

[workspace]
