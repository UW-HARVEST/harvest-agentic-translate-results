[package]
name = "harvest_work_byliOi"
version = "0.1.0"
edition = "2021"

[lib]
# Cargo forbids hyphens in library target names, so the produced object is
# `libharvest_work_byliOi.so` (the C build produces `libharvest-work-byliOi.so`).
name = "harvest_work_byliOi"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
