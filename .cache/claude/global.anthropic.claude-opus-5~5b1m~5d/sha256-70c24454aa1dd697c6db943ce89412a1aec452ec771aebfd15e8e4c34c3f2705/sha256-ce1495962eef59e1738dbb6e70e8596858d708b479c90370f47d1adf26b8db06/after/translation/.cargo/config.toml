# The crates.io index is unreachable from this environment; the required
# dev-dependencies (libloading, libc, cfg-if) are already in the local registry
# cache and pinned in Cargo.lock.
[net]
offline = true

# The differential tests share process-global state -- the loaded libraries'
# `static int inner` and the process-wide stdout, which is redirected to capture
# `printf` output -- so they must not run concurrently.
[env]
RUST_TEST_THREADS = "1"
