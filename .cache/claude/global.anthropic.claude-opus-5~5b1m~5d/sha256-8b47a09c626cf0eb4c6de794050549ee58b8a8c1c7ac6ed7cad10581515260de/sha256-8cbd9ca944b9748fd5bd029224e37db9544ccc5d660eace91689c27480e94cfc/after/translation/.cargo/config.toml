[env]
# The differential tests capture libc `printf` output by redirecting file
# descriptor 1, which is process-global. libtest's own progress text ("test
# foo ... ok") is also written to fd 1, so with several test threads running
# concurrently the harness's text lands inside a capture window and corrupts
# the comparison. Force the suite to run one test at a time.
RUST_TEST_THREADS = "1"
