# The differential suite captures `driver`'s output by temporarily redirecting
# file descriptor 1, which is process-global state. libtest's own progress
# output also goes to fd 1, so the tests must not run concurrently or a capture
# could be contaminated (masking or faking a divergence). Force single-threaded
# test execution so that a bare `cargo test` is correct by default.
[env]
RUST_TEST_THREADS = "1"
