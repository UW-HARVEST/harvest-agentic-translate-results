[package]
name = "harvest_translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "siphash_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Test-only driver used to compare the C and Rust `siphash` stdout byte-for-byte
# in a clean child process (no test-harness output on stdout).  It has no
# dependencies (raw dlopen/dlsym) so it does not affect the cdylib.
[[bin]]
name = "siphash_driver"
path = "src/bin/siphash_driver.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
