# The differential tests capture the process-wide fd 1 to compare the stdout
# produced by the C .so and the Rust .so byte for byte. libtest's own progress
# output ("test foo ... ok") is written to the real fd 1 from the harness
# thread, so with more than one test thread it would land inside a capture
# window and corrupt the comparison. Force sequential execution.
[env]
RUST_TEST_THREADS = "1"
