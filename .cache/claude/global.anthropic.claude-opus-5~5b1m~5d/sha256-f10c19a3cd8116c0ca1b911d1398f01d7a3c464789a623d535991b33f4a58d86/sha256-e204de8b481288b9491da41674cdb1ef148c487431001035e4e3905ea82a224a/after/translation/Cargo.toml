[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"

# The differential tests drive the binary that `cargo test` builds, which uses
# the dev profile. The workload is ~5*10^10 integer operations, so an
# unoptimised build would make the suite unusably slow. Overflow checks stay on
# (every wrapping operation in the program is written explicitly), so this only
# changes speed, never behaviour.
[profile.dev]
opt-level = 3

[workspace]
