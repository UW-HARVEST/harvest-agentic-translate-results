[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "driver"
path = "src/main.rs"

# CMake cache variables become Cargo features, using the exact same value name
# in lowercase:
#
#   OP     -> "add" (default) | "sub" | "mul"
#   REPEAT -> "0" | "1" | "2" | "3" | "4" | "5" (default) | "6" | "7"
#
# No feature is enabled by default so that e.g. `--features sub` selects the
# `sub` operation unambiguously; when no feature of a family is selected the
# CMake/`mdmacros.h` defaults (OP=add, REPEAT=5) are used.
[features]
# OP values
add = []
sub = []
mul = []
# REPEAT values
"0" = []
"1" = []
"2" = []
"3" = []
"4" = []
"5" = []
"6" = []
"7" = []

[profile.release]
panic = "abort"
