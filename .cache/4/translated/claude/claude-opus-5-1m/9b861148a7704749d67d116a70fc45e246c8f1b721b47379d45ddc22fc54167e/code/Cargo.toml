[package]
name = "mujs"
version = "1.3.8"
edition = "2021"

[lib]
name = "mujs"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "unwind"
opt-level = 2
overflow-checks = false
debug-assertions = false

# The interpreter relies on C wrap-around integer semantics and on unwinding
# (used to emulate setjmp/longjmp), so keep those settings in debug builds too.
[profile.dev]
panic = "unwind"
overflow-checks = false
debug-assertions = false
