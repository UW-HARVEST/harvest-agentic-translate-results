[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
# Matches the C build's artifact name: CMakeLists.txt derives the project name
# from c_src's parent directory, producing libtranslated_rust.so.
name = "translated_rust"
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
