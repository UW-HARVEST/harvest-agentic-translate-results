[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "agglom_lib"
# `rlib` is listed in addition to `cdylib` purely so that `cargo test` treats
# the library as a dependency of the integration tests and therefore always
# REBUILDS `libagglom_lib.so` before running them. The tests never link against
# the rlib - they `dlopen` the `.so` and call its exported symbols only.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"

# This crate is a 1:1 translation of a C library and must reproduce the C's
# behaviour exactly, *including* what happens on the UB the C itself performs
# (e.g. `f4(NULL)` dereferences a null pointer, and `(int)floorf(NaN)` relies on
# `cvttss2si`). Rust's debug-time UB checks turn the former into a panic/abort
# instead of the SIGSEGV the C produces, so they are disabled here to keep the
# dev/test `.so` behaviourally identical to the shipped release `.so`.
[profile.dev]
debug-assertions = false
overflow-checks = false

[profile.test]
debug-assertions = false
overflow-checks = false

[workspace]

[dev-dependencies]
libloading = "0.8"
