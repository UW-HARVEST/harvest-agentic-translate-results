# The differential harness in tests/common/mod.rs forks a child process for
# every captured run. Forking from a multi-threaded process can inherit a locked
# glibc `stdout` mutex and deadlock the child, so the test harness is pinned to a
# single thread. Tests are fast (all rows finish in seconds), so this costs
# nothing.
[env]
RUST_TEST_THREADS = "1"
