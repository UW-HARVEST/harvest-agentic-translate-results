[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "get_predict_func_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
# Test-only: additionally export `diffshim_*` wrappers around the 14 routines
# that are `static` (internal linkage) in c_src/src/lib.c, so the differential
# tests can drive the LOW-LEVEL entry points across the FFI boundary exactly as
# the matching C shim (tests/cshim/cshim.c) does. This feature is OFF by
# default, so the shipped .so keeps byte-exact symbol parity with the C .so.
diff_internals = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
