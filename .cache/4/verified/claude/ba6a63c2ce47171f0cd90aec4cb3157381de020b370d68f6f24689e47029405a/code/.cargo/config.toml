# File descriptor 1 is process-wide state, and the differential tests must
# redirect it to capture exactly what the C `printf` and the Rust translation
# write. libtest's own progress output ("test foo ... ok") also goes to fd 1, so
# with the default multi-threaded harness another thread's progress line can land
# inside a capture window and corrupt the comparison.
#
# Forcing a single test thread keeps every libtest write strictly outside the
# capture windows. `force` is left at its default (false) so an explicit
# RUST_TEST_THREADS in the environment still wins.
[env]
RUST_TEST_THREADS = "1"
