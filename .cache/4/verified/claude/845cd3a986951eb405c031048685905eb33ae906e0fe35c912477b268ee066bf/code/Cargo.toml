[package]
name = "text_analyzer"
version = "0.1.0"
edition = "2021"

# The library form of the translation: exports the same C ABI symbols as the
# shared-library build of c_src/ so that both can be compared through FFI.
[lib]
name = "text_analyzer"
path = "src/lib.rs"
crate-type = ["cdylib"]
# The library exports a C `main` (from c_src/src/main.c), which would clash with
# the `main` of a unit-test harness binary; the library is verified through the
# integration tests in tests/, which `dlopen` the built `.so`.
test = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
