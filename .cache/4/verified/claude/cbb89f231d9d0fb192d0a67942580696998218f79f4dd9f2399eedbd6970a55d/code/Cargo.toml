[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

# C-ABI shared library mirroring the symbols that c_src/src/main.c exports when
# built with `gcc -shared` (`driver`, `main`).  Used by the differential tests
# in tests/, which dlopen both this .so and the C .so via libloading.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
