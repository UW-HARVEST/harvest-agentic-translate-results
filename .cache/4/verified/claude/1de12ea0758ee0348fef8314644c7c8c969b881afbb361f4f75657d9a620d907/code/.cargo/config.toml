# The differential tests capture output by redirecting file descriptor 1, which
# is a PROCESS-WIDE side effect. With libtest's default multi-threaded runner,
# one test's capture window overlaps another test's output (and libtest's own
# "test <name> ... ok" writes), which corrupts the captured bytes and produces
# spurious divergences.
#
# Forcing a single test thread makes libtest write only *between* tests, never
# during a capture window. tests/common/mod.rs additionally holds a global mutex
# across each capture as defence in depth.
[env]
RUST_TEST_THREADS = "1"
