[package]
name = "jansson"
version = "2.15.0"
edition = "2021"

[lib]
name = "jansson"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
# C integer arithmetic wraps; never panic on overflow.
overflow-checks = false
debug-assertions = false

[profile.dev]
# Same semantics as the release build (the C code relies on wrapping arithmetic).
overflow-checks = false
debug-assertions = false

[workspace]
