# The differential tests in tests/differential.rs capture file descriptor 1 to
# compare the byte streams that the C and Rust shared libraries write through
# libc's `stdout`. fd 1 is process-wide, and libtest also writes its own
# "test <name> ... ok" progress lines to it, so tests must not run concurrently
# or that progress text lands inside a capture. Force a single test thread.
[env]
RUST_TEST_THREADS = { value = "1", force = true }
