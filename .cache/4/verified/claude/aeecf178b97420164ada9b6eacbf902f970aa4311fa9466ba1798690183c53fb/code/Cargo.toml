[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "betagamma_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"

[features]
# The C build (c_src/CMakeLists.txt) has no configuration options: it always
# compiles exactly `src/lib.c` with no `-D` defines and no optional sources.
# Consequently the Rust crate has no Cargo features either.  The only valid
# build configuration is the default (empty) feature set.
default = []

[dev-dependencies]
libloading = "0.8"

[workspace]
