[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[features]
# Default configuration matches the CMake defaults: OP=add, REPEAT=5
default = ["add", "5"]

# ---- OP cache variable values ----
add = []
sub = []
mul = []

# ---- REPEAT cache variable values ----
"0" = []
"1" = []
"2" = []
"3" = []
"4" = []
"5" = []
"6" = []
"7" = []

# Convenience aliases for the REPEAT values
repeat_0 = ["0"]
repeat_1 = ["1"]
repeat_2 = ["2"]
repeat_3 = ["3"]
repeat_4 = ["4"]
repeat_5 = ["5"]
repeat_6 = ["6"]
repeat_7 = ["7"]

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
panic = "abort"

[workspace]
