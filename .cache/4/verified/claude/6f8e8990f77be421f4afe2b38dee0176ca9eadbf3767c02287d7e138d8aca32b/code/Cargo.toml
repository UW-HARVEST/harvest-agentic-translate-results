[package]
name = "hello"
version = "0.1.0"
edition = "2024"

[lib]
name = "hello"
path = "src/lib.rs"
crate-type = ["cdylib"]

# The C library (c_src/CMakeLists.txt) has no build options and the translated
# sources have no conditionally-compiled code, so there is no `[features]`
# section: the only valid feature combination is the empty one. See CONFIGS.md.

[dev-dependencies]
# Used by the differential integration tests to `dlopen` BOTH the C `.so` and
# the Rust `.so` and call their exported symbols through the FFI boundary.
libloading = "0.8"
# Used only by the tests, to drive the `stdout` configuration axes the C code's
# `printf` call observes (dup2/pipe/setvbuf/threads).
libc = "0.2"

[profile.release]
panic = "abort"

[workspace]
