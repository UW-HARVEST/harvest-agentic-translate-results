[env]
# The differential tests compare the two implementations by pointing file
# descriptor 1 at a temp file around each FFI call. That redirection is
# process-global, so libtest's own progress lines ("test foo ... ok") from a
# *different* test thread would otherwise land inside a capture window and
# corrupt the comparison. Running the harness single-threaded removes the race;
# `tests/common/mod.rs` also asserts that this is in effect.
RUST_TEST_THREADS = "1"
