[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "buffapp_lib"

[dev-dependencies]
libloading = "0.8"

# Both integration-test targets use a custom sequential harness: `buffapp`
# writes to fd 1 via libc `printf`, and libtest's own multi-threaded progress
# output would otherwise be interleaved into the captured stdout that the
# differential comparison depends on.
[[test]]
name = "phase_b_valid"
path = "tests/phase_b_valid.rs"
harness = false

[[test]]
name = "phase_c_errors"
path = "tests/phase_c_errors.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
