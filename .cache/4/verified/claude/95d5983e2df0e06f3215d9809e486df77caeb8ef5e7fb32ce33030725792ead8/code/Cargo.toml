[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
# `cdylib` gives us a `libdriver.so` whose exported symbol set can be compared
# against a shared library built from `c_src/src/main.c`.
# `cdylib` only: nothing links this crate as a Rust library (the executable
# includes the translation with `#[path]`, and the tests reach it through
# `dlopen`), and adding `rlib` would make cargo build the target twice under
# different panic settings, which collides on the output filename.
crate-type = ["cdylib"]
# There are no unit tests in the library itself; the differential suite in
# tests/ exercises it through the exported C symbols.
test = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
