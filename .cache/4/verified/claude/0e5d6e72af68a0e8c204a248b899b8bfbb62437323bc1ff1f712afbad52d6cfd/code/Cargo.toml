[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

# C-ABI mirror of the C translation unit, used by the differential tests which
# load both this .so and the .so built from c_src/ through libloading.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
