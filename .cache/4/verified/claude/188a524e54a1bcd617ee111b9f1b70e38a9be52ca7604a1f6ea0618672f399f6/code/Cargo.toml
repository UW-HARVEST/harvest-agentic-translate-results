[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

[features]
default = []

[dev-dependencies]
# Required by the verification harness contract. This crate builds an
# EXECUTABLE (no cdylib / shared library), so the differential tests exercise
# the process boundary (argv -> stdout/stderr/exit status) instead of dlopen'd
# exports; libloading is declared for harness parity.
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
