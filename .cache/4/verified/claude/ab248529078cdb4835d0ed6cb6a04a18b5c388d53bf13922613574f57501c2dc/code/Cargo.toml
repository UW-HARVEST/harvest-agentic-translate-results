[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

# C-ABI shared library used only for differential testing against the C build.
# It exports the same symbols as `gcc -shared c_src/src/main.c`.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]
# The library exports a C-ABI `main`, which cannot coexist with the entry point
# that libtest generates, so the lib target has no unit-test harness of its own
# (all tests are the integration tests in `tests/`).
test = false
doctest = false

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
panic = "abort"

[workspace]
