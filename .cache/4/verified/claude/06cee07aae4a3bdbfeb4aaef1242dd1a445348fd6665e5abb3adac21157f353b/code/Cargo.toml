[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "synth_pair_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

# The C library performs no validation whatsoever: `synth_pair` dereferences
# `pcm` and `z` unconditionally, so a null/wild pointer faults (SIGSEGV) instead
# of being diagnosed.  rustc's debug assertions inject language-UB checks that
# turn the very same access into a "null pointer dereference" panic (SIGABRT),
# which is observably different from the C.  Disabling them keeps the
# translation's behaviour identical to the C in every profile, not just release.
# Verified by the crash-parity tests in tests/phase_c_errors.rs.
[profile.dev]
debug-assertions = false

[workspace]
