[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "arity_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# The C library (c_src/CMakeLists.txt + src/lib.c) has NO conditional
# compilation: no #ifdef/#if, no CMake option()/compile_definitions. There is
# therefore exactly ONE build configuration to verify, and the Rust crate
# mirrors that by defining no features. `default` is kept empty and explicit so
# that `--no-default-features` and `--all-features` are both valid, equivalent
# invocations.
default = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

# This cdylib is a drop-in replacement for the C shared library, which performs
# no NULL checks and relies on hardware wrapping for signed overflow. Rust's
# debug assertions / UB checks would turn those into a Rust panic, and because
# the exported functions are `extern "C"` a panic there is non-unwinding and
# aborts the process. That is observably different at the FFI boundary: the C
# `.so` dies with SIGSEGV on `process_string(NULL)` while a checked Rust build
# died with SIGABRT ("null pointer dereference occurred"). Disabling these
# checks makes the dev profile behave like the release profile and like the C.
[profile.dev]
debug-assertions = false
overflow-checks = false

[workspace]
