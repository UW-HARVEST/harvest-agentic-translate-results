[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

# The C original deliberately performs unchecked operations (it dereferences the
# result of `allocate_matrix()` without a NULL check, and it relies on wrapping
# signed arithmetic).  `debug-assertions` makes rustc inject UB checks — e.g. a
# "null pointer dereference occurred" panic, which aborts with SIGABRT where the
# C dies with SIGSEGV — so the dev profile must be built without them in order to
# stay behaviourally identical to the C library.  See `tests/oom_parity.rs`.
[profile.dev]
debug-assertions = false
overflow-checks = false

[workspace]
