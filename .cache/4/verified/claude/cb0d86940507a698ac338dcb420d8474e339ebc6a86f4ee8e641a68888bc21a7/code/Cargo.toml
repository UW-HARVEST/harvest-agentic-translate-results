[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "tritanopia_lib"
path = "src/lib.rs"
# "cdylib" is the artifact under test (loaded via libloading, exactly as an
# external C consumer would).  "rlib" is added so that `cargo test` treats the
# lib target as a dependency of the integration tests and therefore REBUILDS
# the cdylib when src/ changes -- without it, `cargo test` silently reuses a
# stale .so and every differential test passes vacuously.
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
