[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "capsule_lib"
# "rlib" is present only so that `cargo test` treats the library as a dependency
# of the integration tests and therefore rebuilds the cdylib before running
# them. Without it the differential tests can silently load a stale
# libcapsule_lib.so. The shipped cdylib and its exported symbols are unaffected.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
