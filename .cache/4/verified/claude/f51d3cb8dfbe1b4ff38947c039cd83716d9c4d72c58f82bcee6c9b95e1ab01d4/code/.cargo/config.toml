# The differential tests redirect file descriptor 1 to capture what the C and
# Rust shared libraries write through it. fd 1 is process-global and libtest
# also writes its progress output there, so tests MUST run on a single thread —
# otherwise another test's "test foo ... ok" text lands in a capture buffer and
# shows up as a spurious divergence.
[env]
RUST_TEST_THREADS = "1"

# No network access in this environment; all dependencies come from the local
# registry cache.
[net]
offline = true
