[package]
name = "sodium"
version = "1.0.23"
edition = "2024"

[lib]
name = "libsodium"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"
opt-level = 2
overflow-checks = false
debug-assertions = false

[profile.dev]
panic = "abort"
overflow-checks = false
debug-assertions = false

[workspace]
