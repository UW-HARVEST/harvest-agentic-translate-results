[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

# Shared-object surface used by the differential tests: exports the same
# symbols as the C shared library (foo, driver, main).
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
panic = "abort"

[workspace]
