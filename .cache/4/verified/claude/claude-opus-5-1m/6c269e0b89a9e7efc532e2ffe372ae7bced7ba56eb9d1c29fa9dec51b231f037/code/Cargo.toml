[package]
name = "c_src"
version = "0.1.0"
edition = "2021"

[lib]
name = "bin2hex_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
overflow-checks = false
debug-assertions = false

# The C library is compiled without any debug instrumentation, so the dev
# profile must not add Rust's UB checks / overflow checks either: with
# `debug-assertions = on`, a raw dereference of a NULL pointer is turned into a
# controlled `panic_nounwind` -> `SIGABRT`, whereas the C code faults with
# `SIGSEGV`.  Keeping both profiles free of those checks makes the shared object
# behave identically to `libtranslated_rust.so` in every build configuration.
[profile.dev]
overflow-checks = false
debug-assertions = false

[workspace]

[dev-dependencies]
libloading = "0.8"
libc = "0.2"
