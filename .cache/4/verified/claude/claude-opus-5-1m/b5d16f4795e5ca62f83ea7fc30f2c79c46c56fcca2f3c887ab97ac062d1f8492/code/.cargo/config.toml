# The differential tests redirect the process-wide fd 1 to capture what the C /
# Rust shared libraries write through libc `printf`. That redirection is global,
# so libtest's own progress output ("test foo ... ok") would land inside a
# capture window if tests ran concurrently. Forcing one test thread keeps the
# capture windows exclusive.
#
# tests/common/mod.rs also detects leakage and fails loudly if this is ever lost.
[env]
RUST_TEST_THREADS = "1"
