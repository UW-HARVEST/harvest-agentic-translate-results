[package]
name = "pcre2"
version = "10.48.0"
edition = "2021"

[lib]
name = "pcre2"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
opt-level = 2
overflow-checks = false
debug-assertions = false
panic = "abort"

# The C original has no arithmetic overflow traps; the translated code relies on
# wrapping semantics. Keep dev builds of the cdylib faithful to that so a debug
# .so behaves like the release .so and like C.
[profile.dev]
overflow-checks = false
debug-assertions = false

[workspace]
