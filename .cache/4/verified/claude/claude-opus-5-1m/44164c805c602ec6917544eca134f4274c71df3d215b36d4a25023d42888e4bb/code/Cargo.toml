[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "wcscat_lib"

[features]
# The C build (c_src/CMakeLists.txt) has no configuration options / -D defines,
# so the crate likewise has no build-time feature axes. The only valid
# configuration is the empty (default) one.
default = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
