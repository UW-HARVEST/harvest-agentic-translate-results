[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "bitwriter_add_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# The C library (c_src/CMakeLists.txt) has no build-time configuration axes:
# no `option()`, no `target_compile_definitions`, no `#ifdef` in lib.c/lib.h.
# Therefore the Rust crate intentionally declares no features either, and the
# only valid feature combination is the empty one (see CONFIGS.md).
default = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
