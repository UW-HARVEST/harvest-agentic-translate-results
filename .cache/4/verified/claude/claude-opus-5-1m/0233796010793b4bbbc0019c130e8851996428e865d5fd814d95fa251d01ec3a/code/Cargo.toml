[package]
name = "errno-pow"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
opt-level = 2

[workspace]

[dev-dependencies]
# Differential test harness only (see SYMBOLS.md): `libloading` dlopens
# libc/libm to build an independent FFI oracle, `libc` provides the raw
# fork/execve/pipe calls needed to reproduce argc==0 and SIGPIPE conditions.
# Randomized inputs use a self-contained seeded splitmix64 in tests/common.
libloading = "0.8"
libc = "0.2"
