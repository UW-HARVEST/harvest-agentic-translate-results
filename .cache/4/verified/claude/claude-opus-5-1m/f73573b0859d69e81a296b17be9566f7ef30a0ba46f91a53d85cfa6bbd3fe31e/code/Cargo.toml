[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "memchra2_lib"

[features]
# Off by default: exports `itest_*` wrappers around the (otherwise `static`)
# C helpers so the differential test-suite can drive the low-level entry
# points across the `.so` boundary.  With this feature disabled the cdylib
# exports exactly `memchra2`, matching the C library.
internal_test_api = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
