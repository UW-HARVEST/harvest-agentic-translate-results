[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
# The library exports a symbol called `main` (`c_src/src/main.c` is part of the
# shared object, see SYMBOLS.md), which cannot be linked into libtest's own
# `main`.  All tests are integration tests in `tests/`.
test = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[dev-dependencies]
libloading = "0.8"

[workspace]
