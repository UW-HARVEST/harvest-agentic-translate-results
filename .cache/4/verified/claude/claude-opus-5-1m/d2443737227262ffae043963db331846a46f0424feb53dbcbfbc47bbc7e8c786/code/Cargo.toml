[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "div_euclid_lib"

[features]
# The C library has no build-time configuration (no `#ifdef` / no options in
# c_src/CMakeLists.txt), so the crate intentionally defines no features.
# The only valid feature combination is the empty one (== default).
default = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
