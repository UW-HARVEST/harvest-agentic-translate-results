[package]
name = "driver"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# The translated library surface. `crate-type = ["cdylib"]` (and *only* cdylib)
# is deliberate: it produces `libdriver.so` exporting the same C ABI symbols as
# the C shared library (`find_container_of_a`, `find_container_of_b`, `main`),
# and it makes it impossible for the `driver` binary or the integration tests to
# link the implementation directly -- they must go through the `.so`, exactly
# like an external C caller.
[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[[bin]]
name = "driver"
path = "src/main.rs"
test = false

[profile.release]
panic = "abort"

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[workspace]
