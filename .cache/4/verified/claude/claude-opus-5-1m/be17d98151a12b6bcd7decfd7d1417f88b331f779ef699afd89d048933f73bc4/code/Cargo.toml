[package]
name = "translated_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "pinflate_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# This crate is a literal translation of `c_src/src/lib.c`, which deliberately
# performs the same raw pointer arithmetic and integer wrapping as the C
# original -- including dereferencing a NULL `in`/`out` when the caller passes
# one (the C never checks). Rust's debug-assertion UB checks turn those into a
# Rust panic instead of the SIGSEGV the C produces, which is an observable
# behaviour difference for a caller. Disabling them keeps a debug build
# byte-for-byte faithful to the reference C library.
[profile.dev]
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
debug-assertions = false
overflow-checks = false

[workspace]
