[package]
name = "jansson"
version = "2.15.0"
edition = "2021"

[lib]
name = "jansson"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# The C sources rely on C's arithmetic rules: unsigned arithmetic wraps (dtoa.c
# does this deliberately all over its fast paths) and signed overflow is not
# trapped by the compiler either.  Rust's debug profiles would *panic* on those
# operations, which is a behaviour the C library does not have, so overflow
# checks are disabled in every profile -- the release artifact already has them
# off.
[profile.dev]
overflow-checks = false

[profile.test]
overflow-checks = false

[profile.release]
panic = "abort"

[workspace]
