[package]
name = "translated_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "pow43_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# The C library (c_src/) has no build-time configuration: CMakeLists.txt defines
# no options, and lib.c/lib.h contain no #ifdef/#if conditional compilation.
# The crate therefore has exactly one build configuration (no features), and
# `default` is empty so that `--no-default-features` and the plain build are
# identical.
default = []

[profile.release]
panic = "abort"

[dev-dependencies]
libloading = "0.8"

[workspace]
