# The differential tests redirect file descriptor 1 to capture what the C and
# Rust `driver` implementations print. fd 1 is process-wide, so if the libtest
# harness ran tests on parallel threads its own progress output ("test x ... ok")
# would be flushed into a capture window and corrupt the comparison.
#
# Forcing a single test thread removes that interference. The harness in
# tests/common/mod.rs also asserts on the captured line count, so any residual
# contamination fails loudly instead of passing silently.
[env]
RUST_TEST_THREADS = "1"
