# The differential tests capture file descriptor 1 to compare the `printf`
# output of the C library with the Rust library's. That redirect is
# process-global, so the tests must not run concurrently: with more than one
# test thread the harness' own progress output ("test foo ... ") lands inside a
# capture. libtest honours RUST_TEST_THREADS, so plain `cargo test` is safe.
[env]
RUST_TEST_THREADS = "1"
