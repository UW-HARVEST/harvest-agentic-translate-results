[package]
name = "png"
version = "1.6.59"
edition = "2021"

[lib]
name = "libpng"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
overflow-checks = false
debug-assertions = false
panic = "abort"

# The translation relies on C wrap-around arithmetic; the differential tests
# load the *release* cdylib, but keep the dev profile consistent so that a
# debug build of the same sources cannot panic where C would wrap.
[profile.dev]
overflow-checks = false
debug-assertions = false

[workspace]
