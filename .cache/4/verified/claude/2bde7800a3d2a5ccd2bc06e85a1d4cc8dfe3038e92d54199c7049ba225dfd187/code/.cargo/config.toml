# The differential tests capture file descriptor 1 (`dup2`) to compare the bytes
# printf()'d inside the C and Rust shared objects.  fd 1 is process-wide, so the
# test harness must not run tests concurrently — otherwise libtest's own
# "test foo ... ok" progress output (and other threads' library output) lands in
# the captured window.
[env]
RUST_TEST_THREADS = "1"
