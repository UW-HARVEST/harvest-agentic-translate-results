[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

# `no_std` without an `eh_personality` lang item requires abort-on-panic in
# every profile that builds the cdylib.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace]
