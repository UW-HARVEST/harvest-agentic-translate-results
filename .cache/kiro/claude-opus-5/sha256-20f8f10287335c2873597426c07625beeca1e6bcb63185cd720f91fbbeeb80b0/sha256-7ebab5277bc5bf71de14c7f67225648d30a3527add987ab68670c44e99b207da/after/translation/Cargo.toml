[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
libloading = "0.8"

[lib]
# `rlib` is added so that `cargo test` builds the lib target (and therefore the
# cdylib the integration tests dlopen). The cdylib itself is unaffected.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
name = "arr_ins_lib"

[profile.release]
panic = "abort"

[workspace]
