[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# All test targets use a custom sequential runner: capturing the libraries'
# stdout requires redirecting file descriptor 1 process-wide, which is
# incompatible with libtest's multi-threaded harness (its own progress output
# would be captured too).
[[test]]
name = "phase_b_configs"
path = "tests/phase_b_configs.rs"
harness = false

[[test]]
name = "phase_c_errors"
path = "tests/phase_c_errors.rs"
harness = false

[[test]]
name = "phase_d_symbols"
path = "tests/phase_d_symbols.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
