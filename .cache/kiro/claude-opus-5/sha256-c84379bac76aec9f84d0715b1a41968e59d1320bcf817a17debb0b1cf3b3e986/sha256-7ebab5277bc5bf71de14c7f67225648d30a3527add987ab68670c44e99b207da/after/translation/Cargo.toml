[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

# `driver` writes to the process-wide stdout, so its differential test needs
# exclusive control of fd 1; libtest's own progress output would otherwise be
# interleaved into the captured bytes.
[[test]]
name = "level3_driver"
path = "tests/level3_driver.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
