# These differential tests redirect the process-wide file descriptor 1 in
# order to capture what the C and Rust libraries write to `stdout`. fd 1 is
# global to the process, so two tests must never be inside a capture window at
# the same time, and libtest's own progress output must not land inside one.
# Forcing a single test thread makes both guarantees hold no matter how the
# suite is invoked (plain `cargo test` included).
[env]
RUST_TEST_THREADS = "1"
