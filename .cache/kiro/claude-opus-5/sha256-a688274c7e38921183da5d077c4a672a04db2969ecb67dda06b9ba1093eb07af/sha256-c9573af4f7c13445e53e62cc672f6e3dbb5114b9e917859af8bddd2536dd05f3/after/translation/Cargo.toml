[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# The C reference performs no null/alignment/overflow checking, and neither can
# the translation: with `debug-assertions` on, rustc inserts UB precondition
# checks on raw-pointer dereferences, so `fma_array(NULL, .., len > 0)` would
# panic-and-abort (SIGABRT) where the C dies with SIGSEGV. Likewise
# `overflow-checks` would panic on arithmetic the C wraps. Both are disabled in
# every profile so the built artifact behaves identically to the C regardless of
# which profile it was produced from.
[profile.dev]
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
debug-assertions = false
overflow-checks = false

[workspace]
