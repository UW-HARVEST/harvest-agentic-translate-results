[package]
name = "harvest-work-hLiFje"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "gaussian_kernel_lib"

[dev-dependencies]
libloading = "0.8"

# The C `gaussian_kernel` dereferences `dest` with no null check, so
# `gaussian_kernel(NULL, size, radius)` is an unchecked store that faults with
# SIGSEGV. rustc's debug-only UB checks (`debug-assertions`) would instead
# intercept that store and abort with "null pointer dereference occurred"
# (SIGABRT) — an observable divergence from the C, caught by
# `tests/null_deref.rs`. Turning them off makes the dev profile reproduce the
# C's semantics exactly, matching what the release profile already does.
[profile.dev]
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
debug-assertions = false
overflow-checks = false

[workspace]
