[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[[test]]
name = "differential"
path = "tests/differential.rs"
# Custom sequential runner: `driver` reports on stdout, so captures redirect
# fd 1 process-wide and cannot tolerate libtest's parallel progress writes.
harness = false

[profile.release]
panic = "abort"

[workspace]
