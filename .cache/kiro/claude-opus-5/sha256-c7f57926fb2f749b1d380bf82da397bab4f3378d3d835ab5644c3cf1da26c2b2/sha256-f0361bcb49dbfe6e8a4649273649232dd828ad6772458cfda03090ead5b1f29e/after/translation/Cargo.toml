[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# `harness = false`: the tests capture process file descriptor 1 to compare the
# stdout of the two shared objects. libtest's own progress output also goes to
# fd 1 from other threads, which would contaminate those captures, so this test
# provides its own strictly sequential runner.
[[test]]
name = "differential"
path = "tests/differential.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
