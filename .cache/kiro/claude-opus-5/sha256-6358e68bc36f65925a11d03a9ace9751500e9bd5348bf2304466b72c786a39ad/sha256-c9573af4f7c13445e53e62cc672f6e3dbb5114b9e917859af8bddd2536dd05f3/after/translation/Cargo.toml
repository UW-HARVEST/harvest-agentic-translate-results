[package]
name = "pow"
version = "0.1.0"
edition = "2024"

[lib]
name = "pow"
# `cdylib` is the artifact under test. `rlib` is added only so that `cargo
# test` treats the library as a dependency of the integration tests and
# therefore builds the `.so` into the same profile directory as the test
# binaries; the tests still load it exclusively through `libloading`.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
panic = "abort"

[workspace]
