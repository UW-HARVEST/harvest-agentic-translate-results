# The differential tests observe the libraries' output by temporarily
# redirecting file descriptor 1 to a scratch file. fd 1 is process-global, so a
# concurrently running test — or libtest's own "test NAME ... ok" progress
# writes from the harness thread — would leak bytes into a capture. Forcing a
# single test thread makes the capture window exclusive.
[env]
RUST_TEST_THREADS = "1"
