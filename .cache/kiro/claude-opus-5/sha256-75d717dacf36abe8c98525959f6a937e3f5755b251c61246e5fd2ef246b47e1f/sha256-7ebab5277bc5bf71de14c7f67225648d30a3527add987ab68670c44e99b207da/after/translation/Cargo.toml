[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# A custom harness: these tests capture file descriptor 1, which is
# process-global, so they must run sequentially and without libtest writing its
# own progress output onto the descriptor being captured.
[[test]]
name = "driver_diff"
path = "tests/driver_diff.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
