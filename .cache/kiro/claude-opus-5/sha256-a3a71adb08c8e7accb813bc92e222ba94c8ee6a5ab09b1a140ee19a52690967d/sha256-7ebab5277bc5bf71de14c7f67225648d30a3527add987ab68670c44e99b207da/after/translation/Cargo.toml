[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
# `cdylib` is the deliverable; `rlib` is added so that `cargo test` also builds
# the shared object, which the integration tests load through `libloading`.
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
