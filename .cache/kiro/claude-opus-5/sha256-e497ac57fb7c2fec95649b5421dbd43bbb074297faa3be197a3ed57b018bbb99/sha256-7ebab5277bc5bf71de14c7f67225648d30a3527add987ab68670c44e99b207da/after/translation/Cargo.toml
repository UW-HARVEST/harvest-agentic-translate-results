[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# The differential tests redirect the process-wide stdout file descriptor to
# observe `printf` output from both shared objects. libtest's own progress
# writes go to that same descriptor from other threads, which corrupts the
# capture, so this target supplies its own sequential runner instead.
[[test]]
name = "driver_diff"
path = "tests/driver_diff.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
