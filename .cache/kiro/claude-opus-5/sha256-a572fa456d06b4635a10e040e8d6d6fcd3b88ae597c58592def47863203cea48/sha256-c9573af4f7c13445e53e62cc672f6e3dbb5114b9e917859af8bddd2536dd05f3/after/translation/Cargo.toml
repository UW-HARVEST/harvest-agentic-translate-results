[package]
name = "harvest-work-UWirmA"
version = "0.1.0"
edition = "2021"

[lib]
name = "ima_parse_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# `ima_parse` faithfully reproduces the C's undefined behaviour (it dereferences
# `data`, `desc` and `pakt` without any NULL check, exactly like `src/lib.c`).
# Rust's optional UB checks turn those derefs into a panic, and a panic escaping
# an `extern "C"` function aborts (SIGABRT) where the C raises SIGSEGV. Turning
# the checks off keeps the dev-profile `.so` behaviourally identical to the C
# `.so`, which is what the differential tests require. There is no integer
# arithmetic in the crate that can overflow, so `overflow-checks` is moot.
[profile.dev]
debug-assertions = false
overflow-checks = false

# The test harness keeps its own assertions enabled.
[profile.test]
debug-assertions = true
overflow-checks = true

[profile.release]
panic = "abort"

[workspace]
