[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"

[dev-dependencies]
libloading = "0.8"

# Custom harness: the test binary re-executes itself as a child process so that
# the raw stdout byte stream produced through the FFI boundary can be captured
# without any interference from libtest's own output.
[[test]]
name = "ffi_compare"
harness = false

[workspace]
