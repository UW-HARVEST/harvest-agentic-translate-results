# The C and the Rust library each keep their own copy of the file-scope
# `stbds_hash_seed`.  The differential tests only stay meaningful while the two
# globals advance through the same LCG sequence, which requires the paired
# C/Rust calls to be issued in a single, deterministic order.  Running the test
# binaries multi-threaded would interleave them differently on each side.
[env]
RUST_TEST_THREADS = "1"
