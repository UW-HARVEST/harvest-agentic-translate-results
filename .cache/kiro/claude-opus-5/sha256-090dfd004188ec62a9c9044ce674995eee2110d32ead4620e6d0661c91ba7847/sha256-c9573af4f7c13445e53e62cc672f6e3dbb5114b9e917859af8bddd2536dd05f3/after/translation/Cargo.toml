[package]
name = "png"
version = "1.6.59"
edition = "2021"

[lib]
name = "libpng"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

[profile.release]
overflow-checks = false
debug-assertions = false
panic = "abort"

# The C reference build has neither overflow traps nor UB checks, and several
# libpng entry points deliberately dereference their arguments without a NULL
# check (png_get_io_state, png_get_io_chunk_type, most png_set_*).  Keeping the
# dev profile aligned with the release profile makes `cargo test` reproduce the
# same observable behaviour (a SIGSEGV, not a Rust panic) in both profiles.
[profile.dev]
overflow-checks = false
debug-assertions = false

[workspace]
