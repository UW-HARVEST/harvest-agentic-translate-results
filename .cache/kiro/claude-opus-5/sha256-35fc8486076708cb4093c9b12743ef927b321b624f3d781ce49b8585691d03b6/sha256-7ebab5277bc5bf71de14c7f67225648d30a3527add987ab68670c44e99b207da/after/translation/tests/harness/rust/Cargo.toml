[package]
name = "jumpnode-internals-harness"
version = "0.1.0"
edition = "2021"
publish = false

# Test-only harness. It textually includes ../src/lib.rs (which is left
# untouched) so the private helpers and the `static mut` state become
# reachable, and re-exports them under `h_*` names for differential testing
# against the equivalent C harness.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "jumpnode_internals"

[workspace]
