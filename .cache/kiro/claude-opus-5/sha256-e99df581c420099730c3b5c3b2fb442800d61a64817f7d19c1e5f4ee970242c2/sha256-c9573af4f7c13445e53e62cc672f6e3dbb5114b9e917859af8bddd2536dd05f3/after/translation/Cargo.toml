[package]
name = "harvest-work-bwYHBu"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "hdr_compare_lib"

[profile.release]
panic = "abort"

# Differential tests sweep the full 2^32 relevant input space through two FFI
# boundaries; an unoptimised harness makes that take hours instead of seconds.
# Affects test binaries only, never the shipped cdylib.
[profile.test]
opt-level = 3

[dev-dependencies]
libloading = "0.8"
# Used only by the Phase C guard-page test (mmap/mprotect) to prove neither
# implementation reads past the third header byte.
libc = "0.2"

[workspace]
