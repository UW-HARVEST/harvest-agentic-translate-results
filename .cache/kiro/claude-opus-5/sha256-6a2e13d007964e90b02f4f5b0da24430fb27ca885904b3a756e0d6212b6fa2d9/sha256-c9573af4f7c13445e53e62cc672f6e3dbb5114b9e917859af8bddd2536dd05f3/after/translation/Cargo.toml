[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "flip_horizontal_lib"

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

# The C original performs completely unchecked pointer arithmetic and
# dereferences `img` without a null check, so an invalid `cp_image_t*` faults
# (SIGSEGV). Rust's `debug_assertions`-gated UB checks intercept that raw-pointer
# deref and `abort()` (SIGABRT) instead, which is an *observable* behavioral
# difference from the C on exactly the degenerate inputs this translation is
# verified against. Disabling them makes the dev-profile cdylib semantically
# identical to the release cdylib that consumers actually load.
[profile.dev]
debug-assertions = false

[profile.release]
panic = "abort"

[workspace]
