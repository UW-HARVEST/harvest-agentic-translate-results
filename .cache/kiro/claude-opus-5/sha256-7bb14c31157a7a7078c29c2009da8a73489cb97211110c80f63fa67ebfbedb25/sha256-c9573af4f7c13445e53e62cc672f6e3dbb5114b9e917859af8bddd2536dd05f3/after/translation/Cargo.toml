[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# `harness = false` so the test binary owns `main()`. It needs to act as its own
# child process: the differential cases include ones that terminate the process
# with SIGFPE, which cannot be observed from inside libtest.
[[test]]
name = "difftest"
harness = false

[profile.release]
panic = "abort"

[workspace]
