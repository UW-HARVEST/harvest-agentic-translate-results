[package]
name = "complexmode"
version = "0.1.0"
edition = "2021"

[lib]
name = "complexmode_lib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# Custom harness: the tests redirect the process-wide stdout (fd 1) to capture
# what the loaded libraries print, so nothing else may write to it concurrently.
[[test]]
name = "differential"
path = "tests/differential.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
