[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "buffapp_lib"

[dev-dependencies]
libloading = "0.8"

# All rows that compare `buffapp`'s stdout live in their own harness-free,
# strictly sequential binary. `buffapp` writes with `printf`, so capturing it
# means redirecting fd 1 -- which is process-global. Under libtest's default
# thread pool, libtest's own progress lines land inside the capture window and
# produce spurious "divergences". Owning `main()` removes the race entirely.
[[test]]
name = "stdout_diff"
path = "tests/stdout_diff.rs"
harness = false

# The C code dereferences NULL on some inputs (e.g. `append_to_buffer(NULL, s)`
# has no NULL guard) and relies on two's-complement wrapping. `-C
# debug-assertions` makes rustc insert null/alignment checks on raw-pointer
# dereferences, which turns those faults into panics -> SIGABRT instead of the
# C's SIGSEGV. Disabling it keeps the dev build byte-for-byte faithful to the C,
# matching the release build. All arithmetic here already uses explicit
# `wrapping_*` operations, so no overflow checking is lost.
[profile.dev]
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"

[workspace]
