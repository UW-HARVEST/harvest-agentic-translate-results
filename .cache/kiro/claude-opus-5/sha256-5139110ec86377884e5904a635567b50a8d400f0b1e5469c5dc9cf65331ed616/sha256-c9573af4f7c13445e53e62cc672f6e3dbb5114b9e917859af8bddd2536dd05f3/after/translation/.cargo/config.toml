# Export the test executables' symbols into .dynsym so that `calloc` defined in
# tests/alloc_contract.rs interposes the libc one for the dlopened .so files.
# Without -rdynamic the symbol is not in the dynamic symbol table and the .so's
# would bind straight to libc, making that test vacuous.
[build]
rustflags = ["-C", "link-arg=-rdynamic"]
