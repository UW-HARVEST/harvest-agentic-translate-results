[package]
name = "staticalias"
version = "0.1.0"
edition = "2024"

[lib]
name = "StaticAlias"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# The C original dereferences `outer` with no null check, so a null argument is
# undefined behaviour that the cmake build (gcc, no -O, no sanitizer) resolves
# into a SIGSEGV. Rust's debug assertions enable the standard library's UB
# checks, which would instead turn that same input into a "null pointer
# dereference occurred" panic and an abort — an observable behaviour difference
# from the C. Disabling them keeps every profile faithful to the C library.
[profile.dev]
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
debug-assertions = false
overflow-checks = false

[workspace]
