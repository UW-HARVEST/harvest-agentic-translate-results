[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# The differential harness captures file descriptor 1 to observe what each
# `.so` writes through libc `stdout`. libtest's default runner writes its own
# progress lines ("test NAME ... ok") to that same fd from other threads, which
# corrupts the captures, so this test supplies its own sequential runner.
[[test]]
name = "differential"
path = "tests/differential.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
