# The differential harness captures the library's stdout by temporarily
# redirecting fd 1 (see tests/common/mod.rs). libtest's own progress output
# ("test foo ... ok") also goes to fd 1, so with more than one test thread the
# harness's lines can land inside another thread's capture buffer. Running the
# test binaries single-threaded makes the captures deterministic.
[env]
RUST_TEST_THREADS = "1"
