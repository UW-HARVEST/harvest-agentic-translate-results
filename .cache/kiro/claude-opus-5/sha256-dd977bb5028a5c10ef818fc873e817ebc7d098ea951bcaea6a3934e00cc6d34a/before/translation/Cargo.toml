[package]
name = "harvest_work_6PXE3p"
version = "0.1.0"
edition = "2021"

[lib]
name = "str_dups_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

# The C code relies on wrap-around size_t/int arithmetic throughout, so keep
# Rust's overflow checks off in every profile (not just release).
[profile.release]
panic = "abort"
overflow-checks = false

[profile.dev]
panic = "abort"
overflow-checks = false

[workspace]
