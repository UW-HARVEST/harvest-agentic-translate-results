[package]
name = "harvest_work_6PXE3p"
version = "0.1.0"
edition = "2021"

[lib]
name = "str_dups_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

# The C code relies on wrap-around size_t/int arithmetic throughout, so keep
# Rust's overflow checks off in every profile (not just release).
#
# `debug-assertions` must be off too: rustc's debug-assertion instrumentation
# turns a raw NULL/misaligned store into a "null pointer dereference" panic,
# whereas the C simply performs the store and takes a SIGSEGV. Leaving it on
# makes the dev build terminate with SIGABRT where the C terminates with
# SIGSEGV (observable, e.g., `stbds_hmget_key_ts` with `temp == NULL`).
[profile.release]
panic = "abort"
overflow-checks = false
debug-assertions = false

[profile.dev]
panic = "abort"
overflow-checks = false
debug-assertions = false

[dev-dependencies]
libloading = "0.8"

[workspace]
