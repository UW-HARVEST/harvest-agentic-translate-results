[package]
name = "translation"
version = "0.1.0"
edition = "2021"

[lib]
name = "convert_pix_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Mirrors the reference C build, which defines no NDEBUG and therefore has
# `assert()` live (its `.so` imports `__assert_fail`). Disable with
# `--no-default-features` to match a C build with `-DNDEBUG`.
default = ["c_asserts"]
c_asserts = []

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
