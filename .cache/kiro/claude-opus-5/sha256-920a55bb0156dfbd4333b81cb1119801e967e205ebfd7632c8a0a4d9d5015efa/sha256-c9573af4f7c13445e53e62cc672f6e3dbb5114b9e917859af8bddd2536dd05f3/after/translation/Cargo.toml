[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

# The C sources deliberately dereference unchecked allocation results and rely
# on wrapping `int` arithmetic. Rust's debug-only UB checks would turn those
# faults into `SIGABRT` panics ("null pointer dereference occurred") and its
# overflow checks would panic where the C wraps, so the translation would stop
# matching the C for those inputs. Disable both so the dev artifact behaves
# exactly like the release artifact — and like the C.
[profile.dev]
debug-assertions = false
overflow-checks = false

[workspace]
