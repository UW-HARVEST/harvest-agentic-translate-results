[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# `harness = false`: the differential tests redirect the process-wide stdout file
# descriptor around each call in order to capture what `printf` writes from
# inside the loaded `.so`s. libtest's default harness runs test functions on
# several threads and writes its own progress output to fd 1, which lands inside
# those capture windows and corrupts the comparison. A custom single-threaded
# runner makes capture deterministic.
[[test]]
name = "differential"
path = "tests/differential.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
