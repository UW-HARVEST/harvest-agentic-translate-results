[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "inreftree_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# This crate deliberately reproduces the C library's undefined behavior (wrapping
# signed arithmetic, faulting on a NULL `label`, indexing `.rodata` with a
# negative offset). Rust's debug-only UB checks would turn those into Rust
# panics, so the debug profile would NOT behave like the C library while the
# release profile would. Disabling them keeps both profiles faithful.
[profile.dev]
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"

[workspace]
