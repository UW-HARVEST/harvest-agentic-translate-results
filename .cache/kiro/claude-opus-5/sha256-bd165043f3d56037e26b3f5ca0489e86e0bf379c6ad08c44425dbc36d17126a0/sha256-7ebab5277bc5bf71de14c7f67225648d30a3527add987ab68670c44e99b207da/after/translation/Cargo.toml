[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# The differential test redirects the process-wide stdout (fd 1) to capture what
# the C and Rust `.so`s print. libtest's own progress output is written from
# other threads and would land inside those captures, so this test brings its
# own single-threaded `main` instead.
[[test]]
name = "api"
harness = false

[profile.release]
panic = "abort"

[workspace]
