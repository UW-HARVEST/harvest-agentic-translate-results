[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
name = "checkshift_lib"

[dev-dependencies]
libloading = "0.8"

# `harness = false`: the tests redirect file descriptor 1 to capture the C
# `printf` output of both shared libraries, which is incompatible with libtest's
# concurrent progress writes to stdout. Each target runs its cases sequentially
# and reports to stderr instead.
[[test]]
name = "level1_binops"
path = "tests/level1_binops.rs"
harness = false

[[test]]
name = "level2_dispatch"
path = "tests/level2_dispatch.rs"
harness = false

[[test]]
name = "level3_state"
path = "tests/level3_state.rs"
harness = false

[[test]]
name = "level4_checkshift"
path = "tests/level4_checkshift.rs"
harness = false

[[test]]
name = "exports"
path = "tests/exports.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
