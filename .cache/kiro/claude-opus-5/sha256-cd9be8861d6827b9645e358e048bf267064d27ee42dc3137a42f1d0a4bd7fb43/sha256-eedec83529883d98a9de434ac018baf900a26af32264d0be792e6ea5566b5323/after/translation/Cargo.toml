[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driver"
path = "src/main.rs"

[profile.release]
panic = "abort"

# C has no overflow traps and no debug assertions; keep the dev/test build
# semantically identical to the release build so `cargo test` measures the same
# program that `cargo build --release` produces.
[profile.dev]
overflow-checks = false
debug-assertions = false

[workspace]
