[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

[[test]]
name = "differential"
path = "tests/differential.rs"
# The suite redirects the process-wide fd 1 to capture what each `.so` prints.
# libtest's own progress output goes to fd 1 from a different thread, so the
# default harness would contaminate the captures; run the rows sequentially
# from our own `main` instead.
harness = false

[profile.release]
panic = "abort"

[workspace]
