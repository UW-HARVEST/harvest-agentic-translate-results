[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# The library faithfully reproduces C code whose callers are contractually
# `__attribute__((nonnull))`; when that contract is violated the C segfaults.
# rustc's *debug* null-pointer-dereference assertion turns that same SIGSEGV
# into a Rust panic/abort, which shows up as a spurious differential (SIGABRT
# vs SIGSEGV) and makes the dev artifact behave unlike the shipped one.
# Disable it, but keep overflow checks ON — those caught a real bug
# (`tm_year + 1900` aborting where the C wraps; see ERRORS.md).
[profile.dev]
debug-assertions = false
overflow-checks = true

[profile.release]
panic = "abort"

[[test]]
name = "exit_helper"
harness = false

[workspace]
