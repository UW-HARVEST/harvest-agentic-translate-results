[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
# `rlib` is present only so that `cargo test` builds the library target (and
# therefore the `.so`) alongside the integration tests. The tests never link
# against it -- they load the `cdylib` through `libloading`.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
name = "tritanopia_lib"

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
