[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[test]]
name = "differential"
path = "tests/differential.rs"
# libtest cannot be used: capturing the library's stdout requires redirecting
# fd 1 (process-global), which collides with libtest's own parallel progress
# output on fd 1. The test file provides its own serial runner.
harness = false

[dev-dependencies]
libloading = "0.8"

[profile.release]
panic = "abort"

[workspace]
