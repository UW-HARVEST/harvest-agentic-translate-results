[package]
name = "translation"
version = "0.1.0"
edition = "2024"

[lib]
name = "checkshift_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

# These targets compare the *bytes written to fd 1* by the two libraries, so they
# must own fd 1 outright. The default libtest harness writes its own progress
# text to fd 1 from worker threads, which would land inside the captured buffer.
[[test]]
name = "phase_b_higher"
harness = false

[[test]]
name = "phase_b_pipeline"
harness = false

[[test]]
name = "phase_c_errors"
harness = false

[profile.release]
panic = "abort"

[workspace]
