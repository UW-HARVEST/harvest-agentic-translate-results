[package]
name = "long"
version = "0.1.0"
edition = "2021"

[lib]
name = "long"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dev-dependencies]
libloading = "0.8"

[features]
# Prints cycle/memo statistics to stderr; diagnostics only, off by default.
debug-stats = []

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"

[workspace]
