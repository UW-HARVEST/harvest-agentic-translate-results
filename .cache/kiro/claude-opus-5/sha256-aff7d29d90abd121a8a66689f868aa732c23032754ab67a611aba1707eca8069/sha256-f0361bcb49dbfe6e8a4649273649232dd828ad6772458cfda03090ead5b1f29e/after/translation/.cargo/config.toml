# The differential tests capture the process's `stdout` (fd 1) around each call
# into the two shared objects. fd 1 is a process-global resource, so libtest's
# own progress output from *other* test threads would otherwise land inside a
# capture. Force the test harness to run single-threaded; the capture helper
# additionally flushes Rust's buffered stdout before redirecting, so no harness
# bytes can be attributed to the library under test.
[env]
RUST_TEST_THREADS = "1"
