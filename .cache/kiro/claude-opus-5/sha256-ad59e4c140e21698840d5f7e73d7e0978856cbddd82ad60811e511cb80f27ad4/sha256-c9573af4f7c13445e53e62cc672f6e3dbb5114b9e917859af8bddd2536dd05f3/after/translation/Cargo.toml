[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# A custom harness is required: the tests capture fd 1 to diff the two shared
# objects byte for byte, and libtest's own concurrent progress output on fd 1
# would corrupt those captures.
[[test]]
name = "differential"
path = "tests/differential.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
