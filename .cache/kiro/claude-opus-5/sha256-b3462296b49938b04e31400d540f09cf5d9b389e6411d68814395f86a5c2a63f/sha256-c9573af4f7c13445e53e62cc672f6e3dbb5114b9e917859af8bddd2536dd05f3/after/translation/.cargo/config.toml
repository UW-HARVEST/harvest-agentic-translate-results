# The differential tests in tests/ capture file descriptor 1 to compare the
# bytes each shared object writes to stdout. That redirection is process-global,
# so the tests must not run concurrently with each other or with libtest's own
# progress output. Forcing a single test thread makes `cargo test` deterministic
# without the caller having to remember `-- --test-threads=1`.
[env]
RUST_TEST_THREADS = "1"
