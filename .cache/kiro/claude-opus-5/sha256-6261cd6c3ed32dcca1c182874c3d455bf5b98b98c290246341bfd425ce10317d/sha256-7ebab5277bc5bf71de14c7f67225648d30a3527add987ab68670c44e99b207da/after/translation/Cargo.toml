[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"

# The differential test redirects the process's stdout/stderr, which conflicts
# with libtest's parallel progress reporting on those same descriptors.
[[test]]
name = "driver_diff"
path = "tests/driver_diff.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
