# The differential tests for `driver` capture the library's `printf` output by
# temporarily rebinding file descriptor 1. That is a process-global operation, so
# libtest must not run tests concurrently — otherwise the harness's own
# "test ... ok" progress lines land inside a capture window and are mistaken for
# library output.
#
# Setting this here means a plain `cargo test` is correct with no extra flags.
[env]
RUST_TEST_THREADS = { value = "1", force = true }
