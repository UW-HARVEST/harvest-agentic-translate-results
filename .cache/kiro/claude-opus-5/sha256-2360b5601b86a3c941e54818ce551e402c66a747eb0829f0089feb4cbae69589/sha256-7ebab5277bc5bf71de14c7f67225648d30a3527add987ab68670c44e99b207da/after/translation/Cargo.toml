[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dev-dependencies]
libloading = "0.8"
libc = "0.2"

# A custom harness is used: the differential checks redirect file descriptor 1
# to capture C stdio output, and libtest's own concurrent progress reporting
# would otherwise be captured along with it.
[[test]]
name = "differential"
path = "tests/differential.rs"
harness = false

[profile.release]
panic = "abort"

[workspace]
